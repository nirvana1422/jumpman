<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>JUMP MAN</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;touch-action:none;}
  html,body{height:100%;}
  body{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden;font-family:'Courier New',monospace;color:#fff;image-rendering:pixelated;}
  #hud{display:flex;justify-content:space-between;align-items:center;width:360px;color:#fff;font-size:11px;margin-bottom:6px;padding:6px 10px;background:#000;border:2px solid #333;font-family:'Courier New',monospace;}
  #lives{color:#ff4444;font-weight:700;letter-spacing:1px;}
  #score-display{color:#ffdd00;font-weight:700;}
  #canvas{border:3px solid #444;display:block;background:#000;image-rendering:pixelated;}
  #msg{margin-top:8px;color:#ffdd00;font-size:11px;text-align:center;font-family:'Courier New',monospace;letter-spacing:1px;}
  @media(max-width:420px){#hud{width:92vw}#canvas{width:92vw;height:122vw}}
</style>
</head>
<body>
<div id="hud"><span id="lives">♥♥♥</span><span id="score-display">SCORE: 0</span></div>
<canvas id="canvas" width="360" height="480"></canvas>
<div id="msg">PRESS SPACE OR TAP TO JUMP</div>
<script>
(function(){
'use strict';

// ============================================================
// PARTS SYSTEM
// ============================================================
function hasParts(lv, which) {
  if (which === 'arm')  return lv >= 1;
  if (which === 'leg')  return lv >= 2;
  if (which === 'head') return lv >= 3;
  if (which === 'full') return lv >= 4;
  return false;
}

// ============================================================
// AUDIO
// ============================================================
var _AC = null;
function getAC() {
  if (!_AC) _AC = new (window.AudioContext || window.webkitAudioContext)();
  return _AC;
}

function tone(f, type, dur, vol, t0) {
  vol = vol||0.1; t0 = t0||0;
  try {
    var a=getAC(), o=a.createOscillator(), g=a.createGain();
    o.connect(g); g.connect(a.destination);
    o.type=type; o.frequency.value=f;
    var s=a.currentTime+t0;
    g.gain.setValueAtTime(vol,s);
    g.gain.exponentialRampToValueAtTime(0.001,s+dur);
    o.start(s); o.stop(s+dur+0.05);
  } catch(e){}
}

var seJump   = function(){ tone(320,'square',0.08,0.18); tone(480,'square',0.06,0.14,0.07); };
var seJump2  = function(){ tone(420,'square',0.08,0.18); tone(640,'square',0.06,0.14,0.07); };
var seJump3  = function(){ tone(560,'square',0.09,0.20); tone(840,'square',0.07,0.16,0.07); };
var seGnd    = function(){ tone(60,'sawtooth',0.15,0.28); };
var seLife   = function(){ [523,659,784,1047].forEach(function(f,i){ tone(f,'square',0.1,0.18,i*0.08); }); };
var seSpeed  = function(){ [300,400,500,600].forEach(function(f,i){ tone(f,'sawtooth',0.07,0.12,i*0.05); }); };
var seTriple = function(){ [400,600,800,1050].forEach(function(f,i){ tone(f,'square',0.08,0.14,i*0.06); }); };

var seDamage = function(){
  try {
    var a=getAC(), t=a.currentTime;
    var o=a.createOscillator(), g=a.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(440,t);
    o.frequency.exponentialRampToValueAtTime(110,t+0.3);
    g.gain.setValueAtTime(0.35,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.4);
  } catch(e){}
};

  try {
    var a = getAC(), now = a.currentTime;
    var fanfareNotes = [
      [261.6,0.0],[329.6,0.08],[392.0,0.16],
      [523.2,0.24],[659.3,0.32],[784.0,0.40],[1046.5,0.48]
    ];
    fanfareNotes.forEach(function(n) {
      var o = a.createOscillator(), g = a.createGain();
      o.type = 'square'; o.frequency.value = n[0];
      g.gain.setValueAtTime(0.22, now + n[1]);
      g.gain.exponentialRampToValueAtTime(0.001, now + n[1] + 0.12);
      o.connect(g); g.connect(a.destination);
      o.start(now + n[1]); o.stop(now + n[1] + 0.15);
    });
    [523.2, 659.3, 784.0].forEach(function(f, i) {
      var o = a.createOscillator(), g = a.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.12, now + 0.48 + i * 0.03);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
      o.connect(g); g.connect(a.destination);
      o.start(now + 0.48 + i * 0.03); o.stop(now + 1.0);
    });
  } catch(e) {}
};

function seKill(combo) {
  var lv = getLevel();
  if (!hasParts(lv, 'arm')) return;
  try {
    var a=getAC(), now=a.currentTime;
    var semitones=Math.min((combo-1)*2, 12);
    var pitch=Math.pow(2, semitones/12);
    var blen=Math.floor(a.sampleRate*0.055);
    var buf=a.createBuffer(1,blen,a.sampleRate);
    var bd=buf.getChannelData(0);
    for(var i=0;i<blen;i++) bd[i]=(Math.random()*2-1)*Math.pow(1-i/blen,0.7);
    var ns=a.createBufferSource(); ns.buffer=buf;
    var nhp=a.createBiquadFilter(); nhp.type='bandpass'; nhp.frequency.value=600*pitch; nhp.Q.value=0.8;
    var ng=a.createGain(); ng.gain.setValueAtTime(1.1,now); ng.gain.exponentialRampToValueAtTime(0.001,now+0.055);
    ns.connect(nhp); nhp.connect(ng); ng.connect(a.destination); ns.start(now);
    var o1=a.createOscillator(), g1=a.createGain();
    o1.type='square';
    o1.frequency.setValueAtTime(95*pitch,now); o1.frequency.exponentialRampToValueAtTime(55*pitch,now+0.10);
    g1.gain.setValueAtTime(0,now); g1.gain.linearRampToValueAtTime(0.65,now+0.004); g1.gain.exponentialRampToValueAtTime(0.001,now+0.13);
    o1.connect(g1); g1.connect(a.destination); o1.start(now); o1.stop(now+0.15);
    var o2=a.createOscillator(), g2=a.createGain();
    o2.type='sawtooth';
    o2.frequency.setValueAtTime(200*pitch,now+0.01); o2.frequency.exponentialRampToValueAtTime(520*pitch,now+0.07);
    g2.gain.setValueAtTime(0,now+0.01); g2.gain.linearRampToValueAtTime(0.38,now+0.018); g2.gain.exponentialRampToValueAtTime(0.001,now+0.08);
    var lp=a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2200;
    o2.connect(lp); lp.connect(g2); g2.connect(a.destination); o2.start(now+0.01); o2.stop(now+0.10);
    var o3=a.createOscillator(), g3=a.createGain();
    o3.type='sine';
    o3.frequency.setValueAtTime(880*pitch,now+0.015); o3.frequency.linearRampToValueAtTime(1100*pitch,now+0.05);
    g3.gain.setValueAtTime(0,now+0.015); g3.gain.linearRampToValueAtTime(0.22,now+0.022); g3.gain.exponentialRampToValueAtTime(0.001,now+0.065);
    o3.connect(g3); g3.connect(a.destination); o3.start(now+0.015); o3.stop(now+0.08);
  } catch(e){ tone(120,'square',0.1,0.4); }
}

  function playSequence(notes, type, vol, bpm, startTime) {
    var totalDur=0;
    notes.forEach(function(n){ totalDur += beatDur(bpm,n[1]); });
    var cur = startTime;
    notes.forEach(function(pair){
      var freq=pair[0], dur=beatDur(bpm,pair[1]);
      if(freq !== null){
        try{
          var a=getAC(), o=a.createOscillator(), g=a.createGain();
          o.connect(g); g.connect(a.destination);
          o.type=type; o.frequency.value=freq;
          g.gain.setValueAtTime(0,cur);
          g.gain.linearRampToValueAtTime(vol,cur+0.01);
          g.gain.setValueAtTime(vol,cur+dur*0.75);
          g.gain.linearRampToValueAtTime(0,cur+dur*0.95);
          o.start(cur); o.stop(cur+dur);
        }catch(e){}
      }
      cur += dur;
    });
    return totalDur;

  ctx.globalAlpha=alpha*0.9;
  ctx.strokeStyle=partCol; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(0,8); ctx.lineTo(W,8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,52); ctx.lineTo(W,52); ctx.stroke();
  ctx.globalAlpha=alpha;
  ctx.shadowColor=partCol; ctx.shadowBlur=14;
  ctx.fillStyle=partCol;
  ctx.font='bold 9px "Courier New",monospace';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText('PARTS GET!  '+names[partGetAnim.part],W/2,13);
  ctx.shadowBlur=0;
  ctx.fillStyle='#ffffff';
  ctx.font='bold 8px "Courier New",monospace';
  ctx.fillText('[ '+descs[partGetAnim.part]+' ]',W/2,30);
  ctx.globalAlpha=1;
  ctx.restore();
 if(t>83){
    var fA=(t-83)/7*0.35;
    ctx.fillStyle='rgba(255,255,255,'+fA+')'; ctx.fillRect(0,0,W,H);
  }
  partGetAnim.timer--;
}

function drawLevelUp(){
  if(levelUpTimer<=0) return;
  var lv=getLevel();
  if(partGetAnim&&partGetAnim.timer>0) return;
  var alpha=Math.min(1,levelUpTimer/30);
  ctx.globalAlpha=alpha*0.7; ctx.fillStyle='#000'; ctx.fillRect(0,H/2-36,W,72); ctx.globalAlpha=1;
  ctx.shadowColor=PAL.accent[lv]; ctx.shadowBlur=20;
  ptC('** STAGE CLEAR **',W/2,H/2-28,PAL.accent[lv],11);
  ptC(LEVEL_NAMES[lv],W/2,H/2-10,'#ffffff',13);
  ctx.shadowBlur=0; levelUpTimer--;
}
function drawDamageFlash(){
  if(damageFlash<=0) return;
  ctx.fillStyle='rgba(255,80,80,'+(damageFlash/16*0.5)+')'; ctx.fillRect(0,0,W,H); damageFlash--;
}
function drawComboMultiplier(){
  if(combo<2||comboTimer<=0) return;
  var heat=['#44aaff','#44ffaa','#ffdd00','#ff8800','#ff4444','#ff00ff','#ffffff'];
  var hcol=heat[Math.min(combo-2,heat.length-1)];
  ctx.shadowColor=hcol; ctx.shadowBlur=14;
  ptC(combo+' HIT!!',W/2,50,hcol,13);
  ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(W/2-36,68,72,16);
  ctx.strokeStyle=hcol; ctx.lineWidth=1; ctx.strokeRect(W/2-36,68,72,16);
  ptC('x'+combo+' BONUS',W/2,70,'#ffdd00',9);
  ctx.shadowBlur=0;
}

function drawPartsHUD(){
  var lv=getLevel();
  var parts=[
    {key:'arm',label:'A',col:'#44aaff'},
    {key:'leg',label:'F',col:'#44ff88'},
    {key:'head',label:'H',col:'#ff8800'},
    {key:'full',label:'X',col:'#ffcc00'}
  ];
  var px=W-6, py=H-60;
  parts.forEach(function(p,i){
    var bx=px-(4-i)*20, by=py;
    var has=partsAcquired[p.key];
    ctx.strokeStyle=has?p.col:'#333'; ctx.lineWidth=1;
    ctx.fillStyle=has?p.col+'33':'transparent';
    ctx.fillRect(bx,by,16,14);
    ctx.strokeRect(bx,by,16,14);
    ctx.fillStyle=has?p.col:'#555';
    ctx.font='bold 8px "Courier New",monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(has){ ctx.shadowColor=p.col; ctx.shadowBlur=6; }
    ctx.fillText(p.label,bx+8,by+7);
    ctx.shadowBlur=0;
  });
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}

function drawHUD(){
  var lv=getLevel(), acc=PAL.accent[lv];
  pt('SCORE '+score,8,10,'#ffdd00',11);
  pt('BEST  '+hiScore,8,26,'#888888',9);
  ctx.shadowColor=acc; ctx.shadowBlur=6; ctx.font='bold 9px "Courier New",monospace'; ctx.textAlign='right'; ctx.textBaseline='top'; ctx.fillStyle=acc; ctx.fillText(LEVEL_NAMES[lv],W-6,10); ctx.shadowBlur=0; ctx.textAlign='left';
  var maxJ=P.currentMaxJumps;
  for(var ji=0;ji<maxJ;ji++){ var jx=W-14-ji*16,jy=24; ctx.strokeStyle=acc; ctx.lineWidth=1; ctx.strokeRect(jx,jy,12,10); if(ji<P.jumpsLeft){ ctx.fillStyle=acc; ctx.fillRect(jx+1,jy+1,10,8); } }
  var ox=6; ctx.textBaseline='bottom';
  if(P.speedTimer>0){ ctx.fillStyle='#ffdd00'; ctx.font='bold 8px "Courier New",monospace'; ctx.textAlign='left'; ctx.fillText('SPD '+Math.ceil(P.speedTimer/60),ox,H-6); ox+=60; }
  if(P.tripleTimer>0){ ctx.fillStyle='#ff8800'; ctx.font='bold 8px "Courier New",monospace'; ctx.textAlign='left'; ctx.fillText('JMP '+Math.ceil(P.tripleTimer/60),ox,H-6); }
  ctx.textBaseline='alphabetic';
  drawPartsHUD();
}

function drawTitle(){
  drawBG();
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(0,0,80,0.8)'; ctx.fillRect(0,80,W,100);
  ctx.strokeStyle='#4488ff'; ctx.lineWidth=2; ctx.strokeRect(0,80,W,2); ctx.strokeRect(0,178,W,2);
  var t=frame*0.04;
  ctx.shadowColor='#4488ff'; ctx.shadowBlur=20+10*Math.sin(t);
  ptC('JUMP MAN',W/2,90,'#ffffff',28); ctx.shadowBlur=0;
  ctx.shadowColor='#44aaff'; ctx.shadowBlur=8; ptC('RETRO ACTION',W/2,128,'#44aaff',11); ctx.shadowBlur=0;
  var bounce=Math.abs(Math.sin(t*1.2))*18;
  ctx.save(); ctx.translate(W/2,GND-10-bounce);
  ctx.fillStyle='#2255cc'; ctx.fillRect(-10,-28,20,6); ctx.fillStyle='#3377ff'; ctx.fillRect(-11,-26,22,6);
  ctx.fillStyle='#ffcc88'; ctx.fillRect(-9,-20,18,10); ctx.fillStyle='#000'; ctx.fillRect(-6,-17,3,3); ctx.fillRect(3,-17,3,3);
  ctx.fillStyle='#2255cc'; ctx.fillRect(-11,-10,22,10); ctx.fillStyle='#88aaff'; ctx.fillRect(-6,-8,12,2);
  ctx.fillStyle='#1144bb'; ctx.fillRect(-11,-10,5,8); ctx.fillRect(7,-10,7,8);
  var ll=Math.sin(frame*0.18)*3; ctx.fillStyle='#1144bb'; ctx.fillRect(-9,0,8,6+ll); ctx.fillRect(1,0,8,6-ll); ctx.fillStyle='#0033aa'; ctx.fillRect(-10,6+ll,10,4); ctx.fillRect(0,6-ll,10,4);
  ctx.restore();
  titleBlink++;
  if(Math.floor(titleBlink/28)%2===0){ ctx.shadowColor='#ffdd00'; ctx.shadowBlur=10; ptC('PUSH START',W/2,290,'#ffdd00',13); ctx.shadowBlur=0; }
  ctx.fillStyle='#555577'; ctx.font='bold 8px "Courier New",monospace'; ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText('SPACE / TAP : JUMP  (2 JUMPS)',W/2,330);
  ctx.fillText('STOMP ENEMIES FOR COMBO BONUS!',W/2,346);
  ctx.fillText('GET PARTS AS YOU LEVEL UP!',W/2,362);
  if(hiScore>0){ ctx.shadowColor='#ff8800'; ctx.shadowBlur=6; ptC('HI-SCORE  '+hiScore,W/2,400,'#ff8800',10); ctx.shadowBlur=0; }
  ctx.strokeStyle='#4488ff'; ctx.lineWidth=1; ctx.globalAlpha=0.4; ctx.beginPath(); ctx.moveTo(0,H-30); ctx.lineTo(W,H-30); ctx.stroke(); ctx.globalAlpha=1;
  ctx.fillStyle='#334'; ctx.font='7px "Courier New",monospace'; ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillText('(C) JUMP MAN  ALL RIGHTS RESERVED',W/2,H-4);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}

function updateHUD(){ document.getElementById('lives').textContent='♥'.repeat(Math.max(0,lives)); document.getElementById('score-display').textContent='SCORE: '+score; }

function resetGame(){
  P.x=W/2; P.y=GND; P.vy=0; P.dir=1; P.onGround=true; P.jumpsLeft=2; P.invincible=0; P.speedTimer=0; P.tripleTimer=0; P.vx=0;
  enemies=[]; items=[]; particles=[]; afterImages=[];
  score=0; lives=3; frame=0; combo=0; comboTimer=0; spawnT=0; spawnI=115; itemT=0; itemI=420;
  lastLevel=0; levelUpTimer=0; hitstopFrames=0; damageFlash=0;
  partsAcquired={arm:false,leg:false,head:false,full:false};
  partGetAnim=null;
  state='play'; updateHUD();
  BGM.startLevel(0);
}

function doJump(){
  try{ getAC().resume(); }catch(e){}
  if(state==='title'||state==='gameover'){ resetGame(); return; }
  if(state==='play'&&P.jumpsLeft>0){
    var n=P.currentMaxJumps-P.jumpsLeft;
    if(n===0) seJump(); else if(n===1) seJump2(); else seJump3();
    P.vy=(n===0)?-16:(n===1?-14:-13); P.jumpsLeft--; P.onGround=false;
    P.vx=(P.speedTimer>0?AIR_SPEED*1.2:AIR_SPEED)*P.dir;
    afterImages.push({x:P.x,y:P.y,dir:P.dir,life:12,maxLife:12});
  }
}

document.addEventListener('keydown',function(e){ if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault(); doJump(); } });
canvas.addEventListener('pointerdown',function(e){ e.preventDefault(); doJump(); });

function checkPartsGet(lv){
  var partMap={1:'arm',2:'leg',3:'head',4:'full'};
  var p=partMap[lv];
  if(p && !partsAcquired[p]){
    partsAcquired[p]=true;
    partGetAnim={part:p,timer:110};
    seGetPart();
    for(var bi=0;bi<20;bi++) particles.push({
      x:P.x,y:P.y-P.h/2,
      vx:(Math.random()-0.5)*12,vy:(Math.random()-0.8)*10,
      life:40,maxLife:40,
      size:Math.floor(Math.random()*5)+3,
      color:['#44aaff','#ffcc00','#ff00ff','#ffffff'][Math.floor(Math.random()*4)]
    });
  }
}

function update(){
  frame++;
  if(state==='title') return;
  if(state!=='play') return;
  if(hitstopFrames>0){ hitstopFrames--; return; }
  var lv=getLevel();
  if(lv!==lastLevel){
    lastLevel=lv;
    levelUpTimer=80;
    BGM.startLevel(lv);
    checkPartsGet(lv);
  }
  if(P.onGround) P.vx=(P.speedTimer>0?GROUND_SPEED*1.2:GROUND_SPEED)*P.dir;
  P.x+=P.vx;
  if(P.x>W-P.w/2){ P.x=W-P.w/2; P.dir=-1; P.vx=-Math.abs(P.vx); }
  if(P.x<P.w/2){ P.x=P.w/2; P.dir=1; P.vx=Math.abs(P.vx); }
  P.vy+=0.5; P.y+=P.vy;
  if(P.y>=GND){ P.y=GND; P.vy=0; P.onGround=true; P.jumpsLeft=P.currentMaxJumps; } else { P.onGround=false; }
  if(P.invincible>0) P.invincible--;
  if(P.speedTimer>0) P.speedTimer--;
  if(P.tripleTimer>0){ P.tripleTimer--; if(P.tripleTimer===0&&P.jumpsLeft>2) P.jumpsLeft=2; }
  if(comboTimer>0) comboTimer--; else combo=0;
  if(!P.onGround&&P.vy<0&&frame%3===0&&hasParts(lv,'leg')){
    afterImages.push({x:P.x,y:P.y,dir:P.dir,life:10,maxLife:10});
    if(afterImages.length>16) afterImages.shift();
  }

  var cfg=LVLS[getLevel()];
  if(spawnI>cfg[0]) spawnI=Math.max(cfg[0],spawnI-1.8); else if(spawnI<cfg[0]) spawnI=Math.min(cfg[0],spawnI+0.8);
  if(++spawnT>=Math.round(spawnI)){
    enemies.push({x:Math.random()*(W-60)+30,y:-28,w:26,h:26,vy:cfg[1]+Math.random()*0.7,alive:true,dead:false,deadTimer:0,type:Math.random()<cfg[2]?'fast':'normal'});
    spawnT=0;
  }
  if(++itemT>=itemI){
    var types=['life','life','speed','triple'];
    items.push({x:Math.random()*(W-60)+30,y:-20,vy:1.8,alive:true,type:types[Math.floor(Math.random()*types.length)]});
    itemT=0; itemI=Math.max(300,itemI-5);
  }

  items.forEach(function(item){
    if(!item.alive) return; item.y+=item.vy;
    if(item.y>=GND){ item.alive=false; return; }
    if(hitCheck(item.x-14,item.y-14,28,28,P.x-P.w/2,P.y-P.h,P.w,P.h)){
      item.alive=false;
      if(item.type==='life'){ lives=Math.min(lives+1,9); seLife(); burst(item.x,item.y,'#ff4444',14); }
      else if(item.type==='speed'){ P.speedTimer=360; seSpeed(); burst(item.x,item.y,'#ffdd00',14); }
      else if(item.type==='triple'){
        P.tripleTimer=360; seTriple();
        if(P.onGround) P.jumpsLeft=3;
        burst(item.x,item.y,'#ff8800',14);
      }
      updateHUD();
    }
  });
  items=items.filter(function(i){ return i.alive; });

  enemies.forEach(function(e){
    if(e.dead){ if(++e.deadTimer>18) e.alive=false; return; }
    e.y+=e.vy;
    if(e.y>=GND){
      e.alive=false; seGnd();
      if(P.invincible===0){
        lives--; P.invincible=90; burst(e.x,GND-12,'#ff4444',10); updateHUD();
        seDamage(); damageFlash=16;
        if(hasParts(getLevel(),'head')) hitstopFrames=14;
        if(lives<=0){ state='gameover'; BGM.stop(); if(score>hiScore) hiScore=score; }
      }
      return;
    }
    if(hitCheck(e.x-e.w/2,e.y-e.h,e.w,e.h,P.x-P.w/2,P.y-P.h,P.w,P.h)){
      e.dead=true; combo++; comboTimer=90;
      var pts=(e.type==='fast'?200:100)*combo; score+=pts; if(score>hiScore) hiScore=score;
      seKill(combo);
      burst(e.x,e.y-e.h/2,e.type==='fast'?'#ff8800':'#00ff44',14);
      updateHUD();
      if(hasParts(getLevel(),'head')) hitstopFrames=Math.min(8+combo*2,18);
    }
  });
  enemies=enemies.filter(function(e){ return e.alive; });
  if(frame%1600===0){ score+=50; if(score>hiScore) hiScore=score; updateHUD(); }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  if(state==='title'){ drawTitle(); return; }
  drawBG();
  items.forEach(function(it){ if(it.alive) drawItem(it); });
  enemies.forEach(function(e){ drawEnemy(e); });
  drawAfterImages(); drawPlayer(); drawParticles();
  drawDamageFlash();
  drawComboMultiplier();
  drawHUD(); drawLevelUp();
  drawPartGetAnim();
  if(state==='gameover'){
    ctx.fillStyle='rgba(0,0,0,0.85)'; ctx.fillRect(0,0,W,H);
    ctx.shadowColor='#ff4444'; ctx.shadowBlur=20; ptC('GAME OVER',W/2,130,'#ff4444',22); ctx.shadowBlur=0;
    ctx.shadowColor='#ffdd00'; ctx.shadowBlur=8; ptC('SCORE  '+score,W/2,185,'#ffdd00',12); ptC('BEST   '+hiScore,W/2,207,'#ff8800',12); ctx.shadowBlur=0;
    ptC('MAX  '+LEVEL_NAMES[getLevel()],W/2,240,'#888888',10);
    if(Math.floor(frame/25)%2===0){ ctx.shadowColor='#fff'; ctx.shadowBlur=8; ptC('PUSH START',W/2,290,'#ffffff',12); ctx.shadowBlur=0; }
  }
  document.getElementById('msg').style.display=state==='play'?'none':'block';
}

function gameLoop(){ update(); draw(); requestAnimationFrame(gameLoop); }
P.y=GND; gameLoop();

})();
</script>
</body>
