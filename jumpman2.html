<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>JUMP MAN 2 — faster horizontal, quicker fall</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;touch-action:none}
  body{background:#120718;display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#fff}
  #hud{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:360px;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:10px;background:rgba(0,0,0,0.36);border:1px solid rgba(255,255,255,0.03)}
  #canvas{border-radius:12px;box-shadow:0 14px 36px rgba(0,0,0,0.6);background:transparent;display:block}
  #titleNote{position:absolute;top:62px;left:50%;transform:translateX(-50%);color:#ffd78a;font-size:13px}
  #msg{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:13px;color:#ffd78a}
</style>
</head>
<body>
<div id="hud">
  <div id="title">JUMP MAN 2 — faster horizontal, quicker fall</div>
  <div id="info">SCORE: <span id="score">0</span></div>
</div>
<canvas id="canvas" width="360" height="480"></canvas>
<div id="titleNote">CONFIGだけ変えれば微調整可能です</div>
<div id="msg">クリック/タップ or Spaceでジャンプ（2段可）</div>

<script>
/* ====== 設定（このブロックだけ触ればOK） ====== */
const CONFIG = {
  baseSpeed: 7.0,         // ← 地上での基本横速を増加（左右を速くする）
  airHorzFactor: 0.60,    // ← 空中での横速度比（空中横もある程度欲しい場合0.5→0.6に）
  interp: 0.22,           // ← 補間（慣性）：大きいほど操作が即応（0.14→0.22でより素早く）
  gravity: 0.6,           // ← 基本重力（毎フレームの増分。大きいほど落ちやすい）
  fallMultiplier: 1.9,    // ← 下降時にかかる追加倍率（>1でジャンプ後すぐ落ちる）
  jumpVelocities: [-16, -14, -12], // ← 1段目、2段目、3段目の初速（そのまま）
  afterImageFrames: 12,
  afterImageInterval: 3,
  maxAfterImages: 18
};
/* ================================================ */

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height, GND = H - 60;

let frame = 0, score = 0;
document.getElementById('score').textContent = score;

const Player = {
  x: W/2,
  y: GND,
  w: 28,
  h: 36,
  vy: 0,
  vx: 0,
  dir: 1,
  onGround: true,
  jumpsLeft: 2,
  invincible: 0,
  get currentMaxJumps(){ return 2; }
};

let afterImages = [];

/* 簡易音（ブラウザの許可が必要） */
function tone(f,dur, type='sine', vol=0.08, t0=0){
  try{
    const a = new (window.AudioContext || window.webkitAudioContext)();
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = type; o.frequency.value = f;
    o.connect(g); g.connect(a.destination);
    const s = a.currentTime + t0;
    g.gain.setValueAtTime(vol, s);
    g.gain.exponentialRampToValueAtTime(0.001, s + dur);
    o.start(s); o.stop(s + dur + 0.02);
  }catch(e){}
}
function playJumpSound(stage){
  if(stage===0) tone(380,0.08,'square',0.12);
  else if(stage===1) tone(520,0.08,'square',0.12);
  else tone(680,0.08,'square',0.12);
}

/* 入力 */
document.addEventListener('keydown', e => {
  if(e.code === 'Space'){ e.preventDefault(); doJump(); }
});
canvas.addEventListener('pointerdown', e => { e.preventDefault(); doJump(); });

/* ジャンプ */
function doJump(){
  if(Player.jumpsLeft <= 0) return;
  const used = Player.currentMaxJumps - Player.jumpsLeft;
  const idx = Math.min(used, CONFIG.jumpVelocities.length - 1);
  Player.vy = CONFIG.jumpVelocities[idx];
  Player.jumpsLeft--;
  Player.onGround = false;
  afterImages.push({x:Player.x, y:Player.y, dir:Player.dir, life:CONFIG.afterImageFrames, maxLife:CONFIG.afterImageFrames});
  if(afterImages.length > CONFIG.maxAfterImages) afterImages.shift();
  playJumpSound(used);
}

/* 更新（重力とfallMultiplierの適用） */
function update(){
  frame++;

  // 目標横速度（地上では baseSpeed、空中は airHorzFactor をかける）
  const base = CONFIG.baseSpeed;
  const target = (Player.onGround ? base : base * CONFIG.airHorzFactor) * Player.dir;

  // 補間で滑らかに近づける（interpを上げてレスポンスUP）
  Player.vx += (target - Player.vx) * CONFIG.interp;
  Player.x += Player.vx;

  // 端で反転・慣性処理
  if(Player.x > W - Player.w/2){
    Player.x = W - Player.w/2;
    Player.dir = -1;
    Player.vx = -Math.abs(Player.vx) * 0.5;
  } else if(Player.x < Player.w/2){
    Player.x = Player.w/2;
    Player.dir = 1;
    Player.vx = Math.abs(Player.vx) * 0.5;
  }

  // 重力適用（落下中はfallMultiplierで早く）
  if(Player.vy > 0){ // 既に降下中
    Player.vy += CONFIG.gravity * CONFIG.fallMultiplier;
  } else {
    Player.vy += CONFIG.gravity;
  }
  Player.y += Player.vy;

  // 着地処理
  if(Player.y >= GND){
    Player.y = GND;
    Player.vy = 0;
    Player.onGround = true;
    Player.jumpsLeft = Player.currentMaxJumps;
    Player.vx *= 0.85; // 着地で減衰
  } else {
    Player.onGround = false;
  }

  // 上昇中の残像自動追加
  if(!Player.onGround && Player.vy < 0 && frame % CONFIG.afterImageInterval === 0){
    afterImages.push({x:Player.x, y:Player.y, dir:Player.dir, life:CONFIG.afterImageFrames, maxLife:CONFIG.afterImageFrames});
    if(afterImages.length > CONFIG.maxAfterImages) afterImages.shift();
  }

  // デモ用小スコア処理
  if(frame % 1800 === 0){ score += 50; document.getElementById('score').textContent = score; }
}

/* 描画 */
function draw(){
  // 背景
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, '#1a0026'); grad.addColorStop(1, '#0c0010');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

  // 地面
  ctx.fillStyle = '#201018'; ctx.fillRect(0, GND, W, H - GND);

  // グリッド
  ctx.strokeStyle = 'rgba(255,180,120,0.06)'; ctx.lineWidth = 1;
  for(let x=0;x<W;x+=30){ ctx.beginPath(); ctx.moveTo(x, GND); ctx.lineTo(x, H); ctx.stroke(); }

  // 残像
  for(let i=0;i<afterImages.length;i++){
    const a = afterImages[i];
    const t = a.life / a.maxLife;
    ctx.save();
    ctx.globalAlpha = 0.08 + 0.6 * t;
    if(a.dir === -1){ ctx.translate(a.x,0); ctx.scale(-1,1); ctx.translate(-a.x,0); }
    const px = a.x - Player.w/2, py = a.y - Player.h;
    const scale = 1 - (1 - t) * 0.14;
    ctx.translate(px + Player.w/2, py + Player.h/2);
    ctx.scale(scale, scale);
    ctx.translate(-(px + Player.w/2), -(py + Player.h/2));
    ctx.fillStyle = '#7fdcff'; ctx.fillRect(px+4, py+14, Player.w-8, Player.h-14);
    ctx.fillStyle = '#bff7ff'; ctx.fillRect(px+2, py+14, Player.w-4, Player.h-22);
    ctx.fillStyle = '#ffd7a6'; ctx.fillRect(px+6, py, Player.w-12, 14);
    ctx.restore();
    a.life--;
  }
  afterImages = afterImages.filter(a => a.life > 0);

  // プレイヤー
  if(!(Player.invincible>0 && Math.floor(frame/6)%2===0)){
    ctx.save();
    if(Player.dir === -1){ ctx.translate(Player.x,0); ctx.scale(-1,1); ctx.translate(-Player.x,0); }
    const px = Player.x - Player.w/2, py = Player.y - Player.h;
    ctx.fillStyle = '#0088aa'; ctx.fillRect(px+4, py+14, Player.w-8, Player.h-14);
    ctx.fillStyle = '#00ddff'; ctx.fillRect(px+2, py+14, Player.w-4, Player.h-22);
    ctx.fillStyle = '#ffcc88'; ctx.fillRect(px+6, py, Player.w-12, 14);
    ctx.fillStyle = '#000'; ctx.fillRect(px+10, py+4, 3, 3);
    ctx.fillStyle = '#333';
    const leg = Player.onGround ? Math.sin(frame*0.32)*5 : 0;
    ctx.fillRect(px+4, py+Player.h-8, 8, 8 + leg);
    ctx.fillRect(px+Player.w-12, py+Player.h-8, 8, 8 - leg);
    ctx.restore();
  }

}

/* ループ */
function loop(){ update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
