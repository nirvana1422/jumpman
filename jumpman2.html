  if(levelUpTimer<=0)return;var lv=getLevel(),th=BG_THEMES[lv];
  var alpha=Math.min(1,levelUpTimer/30);
  ctx.fillStyle='rgba(0,0,0,'+alpha*0.5+')';ctx.fillRect(0,H/2-40,W,80);
  ctx.globalAlpha=alpha;ctx.fillStyle=th.accent;ctx.font='16px "Press Start 2P"';ctx.textAlign='center';
  ctx.shadowColor=th.accent;ctx.shadowBlur=20;ctx.fillText('LEVEL UP!',W/2,H/2-10);
  ctx.font='10px "Press Start 2P"';ctx.fillText('LV'+lv+' '+th.name,W/2,H/2+14);
  ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.textAlign='left';levelUpTimer--;
}
function drawHUD(){
  var lv=getLevel(),th=BG_THEMES[lv];
  var lvCols=['#00cc44','#ff8800','#ff4444','#cc44ff','#ff2200'];
  ctx.fillStyle='#ffdd00';ctx.font='10px "Press Start 2P"';ctx.fillText('SCORE '+score,10,24);
  ctx.fillStyle='#888';ctx.font='8px "Press Start 2P"';ctx.fillText('BEST '+hiScore,10,38);
  ctx.fillStyle=lvCols[lv];ctx.font='7px "Press Start 2P"';ctx.textAlign='right';
  ctx.shadowColor=lvCols[lv];ctx.shadowBlur=6;ctx.fillText('LV'+lv+' '+th.name,W-8,24);ctx.shadowBlur=0;ctx.textAlign='left';
  ctx.fillStyle=th.accent+'99';ctx.font='6px "Press Start 2P"';ctx.textAlign='right';
  var bgmNames=['♪WALTZ','♪SYNTH','♪ROCK','♪TECHNO','♪METAL'];
  ctx.fillText(bgmNames[lv],W-8,36);ctx.textAlign='left';
  if(combo>=2&&comboTimer>0){ctx.fillStyle='#ff8800';ctx.font='12px "Press Start 2P"';ctx.textAlign='center';ctx.fillText(combo+' COMBO!',W/2,58);ctx.textAlign='left';}
  var maxJ=P.currentMaxJumps;ctx.strokeStyle=th.accent+'cc';ctx.lineWidth=1.5;
  for(var i=0;i<maxJ;i++){ctx.strokeRect(W-22-i*15,30,12,12);if(i<P.jumpsLeft){ctx.fillStyle=th.accent+'aa';ctx.fillRect(W-21-i*15,31,10,10);}}
  var ox=8;
  if(P.speedTimer>0){ctx.fillStyle='#ff8800';ctx.font='7px "Press Start 2P"';ctx.fillText('⚡'+Math.ceil(P.speedTimer/60)+'s',ox,H-8);ox+=58;}
  if(P.tripleTimer>0){ctx.fillStyle='#cc44ff';ctx.font='7px "Press Start 2P"';ctx.fillText('⬆️'+Math.ceil(P.tripleTimer/60)+'s',ox,H-8);}
}
function updateHUD(){
  document.getElementById('lives').textContent='❤️'.repeat(Math.max(0,lives));
  document.getElementById('score-display').textContent='SCORE: '+score;
}
function resetGame(){
  P.x=W/2;P.y=GND;P.vy=0;P.dir=1;P.onGround=true;P.jumpsLeft=2;P.invincible=0;P.speedTimer=0;P.tripleTimer=0;
  enemies=[];items=[];particles=[];lavaParticles=[];
  score=0;lives=3;frame=0;combo=0;comboTimer=0;spawnT=0;spawnI=145;itemT=0;itemI=480;
  lastLevel=0;levelUpTimer=0;bgmLevel=-1;state='play';updateHUD();playBGM(0);
}
function doJump(){
  if(state==='title'||state==='gameover'){resetGame();return;}
  if(state==='play'&&P.jumpsLeft>0){
    var n=P.currentMaxJumps-P.jumpsLeft;
    if(n===0)seJump();else if(n===1)seJump2();else seJump3();
    P.vy=n===0?-12.5:(n===1?-11:-10);P.jumpsLeft--;P.onGround=false;
  }
}
document.addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();doJump();}});
canvas.addEventListener('pointerdown',function(e){e.preventDefault();doJump();});
function update(){
  frame++;if(state!=='play')return;
  var lv=getLevel();
  if(lv!==lastLevel){lastLevel=lv;levelUpTimer=90;try{playBGM(lv);}catch(e){}}
  P.x+=P.speed*P.dir;if(P.x>W-P.w/2)P.dir=-1;if(P.x<P.w/2)P.dir=1;
  P.vy+=0.5;P.y+=P.vy;
  if(P.y>=GND){P.y=GND;P.vy=0;P.onGround=true;P.jumpsLeft=P.currentMaxJumps;}
  if(P.invincible>0)P.invincible--;if(P.speedTimer>0)P.speedTimer--;
  if(P.tripleTimer>0){P.tripleTimer--;if(P.tripleTimer===0&&P.jumpsLeft>2)P.jumpsLeft=2;}
  if(comboTimer>0)comboTimer--;else combo=0;
  var cfg=LVLS[lv];
  if(spawnI>cfg[0])spawnI=Math.max(cfg[0],spawnI-1.5);else if(spawnI<cfg[0])spawnI=Math.min(cfg[0],spawnI+1);
  if(++spawnT>=Math.round(spawnI)){
    enemies.push({x:Math.random()*(W-60)+30,y:-24,w:28,h:28,vy:cfg[1]+Math.random()*0.8,alive:true,dead:false,deadTimer:0,type:Math.random()<cfg[2]?'fast':'normal'});
    spawnT=0;
  }
  if(++itemT>=itemI){
    var types=['life','life','speed','triple'];
    items.push({x:Math.random()*(W-60)+30,y:-24,vy:1.8,alive:true,type:types[Math.floor(Math.random()*types.length)]});
    itemT=0;itemI=Math.max(350,itemI-4);
  }
  items.forEach(function(item){
    if(!item.alive)return;item.y+=item.vy;if(item.y>=GND){item.alive=false;return;}
    if(hitCheck(item.x-14,item.y-14,28,28,P.x-P.w/2,P.y-P.h,P.w,P.h)){
      item.alive=false;
      if(item.type==='life'){lives=Math.min(lives+1,9);seLife();burst(item.x,item.y,'#ff4466',14);}
      else if(item.type==='speed'){P.speedTimer=360;seSpeed();burst(item.x,item.y,'#ff8800',14);}
      else if(item.type==='triple'){P.tripleTimer=360;seTriple();if(P.onGround)P.jumpsLeft=3;burst(item.x,item.y,'#cc44ff',14);}
      updateHUD();
    }
  });
  items=items.filter(function(i){return i.alive;});
  enemies.forEach(function(e){
    if(e.dead){if(++e.deadTimer>20)e.alive=false;return;}
    e.y+=e.vy;
    if(e.y>=GND){e.alive=false;seGnd();if(P.invincible===0){lives--;P.invincible=100;burst(e.x,GND-12,'#ff4466',8);updateHUD();if(lives<=0){state='gameover';if(score>hiScore)hiScore=score;}}return;}
    if(hitCheck(e.x-e.w/2,e.y-e.h,e.w,e.h,P.x-P.w/2,P.y-P.h,P.w,P.h)){e.dead=true;combo++;comboTimer=90;score+=(e.type==='fast'?200:100)*combo;if(score>hiScore)hiScore=score;seKill();burst(e.x,e.y-e.h/2,'#ffdd00',12);updateHUD();}
  });
  enemies=enemies.filter(function(e){return e.alive;});
  if(frame%1800===0){score+=50;if(score>hiScore)hiScore=score;updateHUD();}
}
function drawTitle(){
  var th=BG_THEMES[0];var grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,th.skyTop);grad.addColorStop(1,th.skyBot);ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  stars.forEach(function(s){s.tw+=s.speed;ctx.fillStyle=th.starCol;ctx.globalAlpha=0.4+0.6*Math.abs(Math.sin(s.tw));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.shadowColor='#00ffaa';ctx.shadowBlur=20;
  ctx.fillStyle='#00ffaa';ctx.font='30px "Press Start 2P"';ctx.fillText('JUMP',W/2,H/2-90);ctx.fillText('MAN',W/2,H/2-46);ctx.shadowBlur=0;
  var info=[['敵に触れたら倒せる！','#ffdd00',8,H/2+4],['地面に落ちた敵はライフ減','#ffdd00',8,H/2+24],['❤️ライフ  ⚡スピード  ⬆️3段','#aaffdd',8,H/2+48],['スコアでBGM&背景が変わる！','#ff88ff',7,H/2+70],['Lv1:2000 Lv2:5000 Lv3:10000','#888',7,H/2+88],['Lv4:20000','#888',7,H/2+104]];
  info.forEach(function(v){ctx.fillStyle=v[1];ctx.font=v[2]+'px "Press Start 2P"';ctx.fillText(v[0],W/2,v[3]);});
  if(Math.floor(frame/30)%2===0){ctx.fillStyle='#fff';ctx.font='10px "Press Start 2P"';ctx.fillText('TAP TO START',W/2,H/2+128);}
  ctx.textAlign='left';
}
function draw(){
  if(state==='title'){drawTitle();return;}
  drawBG();
  if(state==='play'){items.forEach(drawItem);enemies.forEach(drawEnemy);drawPlayer();drawParticles();drawHUD();drawLevelUp();}
  if(state==='gameover'){
    enemies.forEach(drawEnemy);var lv=getLevel();
    ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';
    ctx.fillStyle='#ff4466';ctx.shadowColor='#ff4466';ctx.shadowBlur=16;ctx.font='20px "Press Start 2P"';ctx.fillText('GAME OVER',W/2,H/2-55);ctx.shadowBlur=0;
    ctx.fillStyle='#ffdd00';ctx.font='10px "Press Start 2P"';ctx.fillText('SCORE: '+score,W/2,H/2-10);ctx.fillText('BEST:  '+hiScore,W/2,H/2+16);
    ctx.fillStyle=BG_THEMES[lv].accent;ctx.font='8px "Press Start 2P"';ctx.fillText('MAX LV: '+lv+' '+LEVEL_NAMES[lv],W/2,H/2+40);
    if(Math.floor(frame/30)%2===0){ctx.fillStyle='#fff';ctx.font='9px "Press Start 2P"';ctx.fillText('TAP TO RETRY',W/2,H/2+72);}
    ctx.textAlign='left';
  }
  document.getElementById('msg').style.display=state==='play'?'none':'block';
}
function loop(){update();draw();requestAnimationFrame(loop);}
P.y=GND;loop();
</script>
