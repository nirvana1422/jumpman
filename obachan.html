var _AC = null;
function getAC() {
if (!_AC) _AC = new (window.AudioContext || window.webkitAudioContext)();
return _AC;
}
function beep(freq, type, dur, vol, delay) {
try {
var a = getAC(), o = a.createOscillator(), g = a.createGain();
o.connect(g); g.connect(a.destination);
o.type = type || ‘square’; o.frequency.value = freq;
var t = a.currentTime + (delay || 0);
g.gain.setValueAtTime(vol || 0.1, t);
g.gain.exponentialRampToValueAtTime(0.001, t + dur);
o.start(t); o.stop(t + dur + 0.05);
} catch(e) {}
}
function playJump()  { beep(440,‘square’,0.08,0.12); beep(660,‘square’,0.05,0.08,0.07); }
function playHit()   { beep(150,‘sawtooth’,0.06,0.2); beep(100,‘sawtooth’,0.08,0.18,0.06); }
function playItem()  { [440,550,660,880].forEach(function(f,i){ beep(f,‘square’,0.07,0.12,i*0.06); }); }
function playLevel() { [330,415,523,659,784].forEach(function(f,i){ beep(f,‘square’,0.1,0.14,i*0.07); }); }
function playOver()  { [330,262,196,147].forEach(function(f,i){ beep(f,‘sawtooth’,0.1,0.2,i*0.1); }); }

function playBGM(lv) {
if (bgmLv === lv) return;
bgmLv = lv;
if (bgmTimer) { clearTimeout(bgmTimer); bgmTimer = null; }
var D = BGMS[lv], a = getAC();
var mLen = D.notes.reduce(function(s,n){ return s+n[1]; }, 0);
var bLen = D.bass.reduce(function(s,n){ return s+n[1]; }, 0);
function bgmLoop(st) {
if (bgmLv !== lv) return;
var t = st;
D.notes.forEach(function(n){ if(n[0]>0) beep(n[0],D.mt,n[1]*.75,D.mv,t-a.currentTime); t+=n[1]; });
t = st;
var rep = Math.ceil(mLen/bLen);
for (var r=0; r<rep; r++) D.bass.forEach(function(n){ if(n[0]>0) beep(n[0],D.bt,n[1]*.7,D.bv,t-a.currentTime); t+=n[1]; });
if (D.kick>0) for (var k=0; k<=Math.floor(mLen/D.kick); k++) beep(80,‘sine’,.12,.22,st+k*D.kick-a.currentTime);
if (D.hat>0)  for (var h=0; h<=Math.floor(mLen/D.hat);  h++) beep(8000,‘sawtooth’,.02,.02,st+h*D.hat-a.currentTime);
bgmTimer = setTimeout(function(){ bgmLoop(a.currentTime+.08); }, (mLen-.3)*1000);
}
bgmLoop(a.currentTime + .08);
}

function wallSpeed() { return 1.3 + lvl * 0.5 + score * 0.00010; }
function wallGap()   { return Math.max(50, 100 - lvl * 8); }

function makeWallSegs() {
var segs = [];
var r = Math.random();

if (r < 0.30) {
var gw = 85 + Math.random() * 65;
var gx = 10 + Math.random() * (W - 20 - gw);
if (gx > 0)      segs.push({x:0,        w:gx});
if (gx+gw < W)   segs.push({x:gx+gw,    w:W-(gx+gw)});

} else if (r < 0.55) {
var g1w = 65 + Math.random() * 35;
var g1x = 8  + Math.random() * 50;
var gap = 18 + Math.random() * 30;
var g2x = g1x + g1w + gap;
var g2w = 65 + Math.random() * 35;
if (g2x + g2w > W - 8) g2w = W - 8 - g2x;
if (g2w < 50) { r = 0; return makeWallSegs(); }
if (g1x > 0)           segs.push({x:0,       w:g1x});
if (gap > 0)            segs.push({x:g1x+g1w, w:gap});
if (g2x+g2w < W)       segs.push({x:g2x+g2w, w:W-(g2x+g2w)});

} else if (r < 0.68) {
segs.push({x:0, w:12 + Math.random()*40});

} else if (r < 0.80) {
var sw = 12 + Math.random()*40;
segs.push({x:W-sw, w:sw});

} else if (r < 0.90) {
var cw = 35 + Math.random()*70;
var cx = (W-cw)/2 + (Math.random()-0.5)*50;
cx = Math.max(50, Math.min(W-50-cw, cx));
segs.push({x:cx, w:cw});

} else {
var gw2 = 140 + Math.random()*80;
if (gw2 > W-20) gw2 = W-20;
var gx2 = 10 + Math.random()*(W-20-gw2);
if (gx2 > 0)      segs.push({x:0,       w:gx2});
if (gx2+gw2 < W)  segs.push({x:gx2+gw2, w:W-(gx2+gw2)});
}

return segs;
}

function hitsWall(segs, px, pw) {
if (phaseF > 0) return false;
var pl = px - pw/2 + 4;
var pr = px + pw/2 - 4;
for (var i = 0; i < segs.length; i++) {
var s = segs[i];
if (pr > s.x + 2 && pl < s.x + s.w - 2) return true;
}
return false;
}

dir:Math.random()<0.5?1:-1,

}

if (score >= 1000) return 2;

function drawObachan(x, y, sc, animT) {
sc = sc||1;
ctx.save(); ctx.translate(x,y); ctx.scale(sc,sc);
var bob = Math.sin(animT*0.18)*2;

ctx.fillStyle = phaseF>0 ? ‘rgba(100,200,255,0.75)’ : ‘#cc4488’;

ctx.fillStyle = phaseF>0 ? ‘rgba(80,180,255,0.8)’ : ‘#dd6699’;
ctx.beginPath(); ctx.ellipse(0,-4+bob,9,9,0,0,Math.PI*2); ctx.fill();
ctx.fillStyle = ‘#ffcc88’;
ctx.beginPath(); ctx.arc(0,-16+bob,10,0,Math.PI*2); ctx.fill();
ctx.fillStyle = ‘#eeeeee’;
[[-6,-23],[0,-25],[6,-23],[-4,-21],[4,-21]].forEach(function(p){ ctx.beginPath(); ctx.arc(p[0],p[1]+bob,5,Math.PI,0); ctx.fill(); });
ctx.fillStyle=’#333’;
ctx.beginPath(); ctx.arc(-3.5,-16+bob,1.8,0,Math.PI*2); ctx.fill();
ctx.beginPath(); ctx.arc(3.5,-16+bob,1.8,0,Math.PI*2); ctx.fill();
ctx.fillStyle=‘rgba(255,120,120,0.5)’;
ctx.beginPath(); ctx.arc(-6,-13+bob,3.5,0,Math.PI*2); ctx.fill();
ctx.beginPath(); ctx.arc(6,-13+bob,3.5,0,Math.PI*2); ctx.fill();
var arm = Math.sin(animT*0.2)*8;
ctx.fillStyle=’#ffcc88’;
ctx.beginPath(); ctx.arc(-13,-4+bob+arm*0.4,4.5,0,Math.PI*2); ctx.fill();
ctx.beginPath(); ctx.arc(13,-4+bob-arm*0.4,4.5,0,Math.PI*2); ctx.fill();
ctx.fillStyle=’#7733bb’; ctx.fillRect(10,-2+bob,7,9);
ctx.strokeStyle=’#fff’; ctx.lineWidth=1; ctx.strokeRect(10,-2+bob,7,9);
var leg = Math.abs(Math.sin(animT*0.22))*5;
ctx.fillStyle=’#aa7744’;
ctx.fillRect(-7,14+bob,5,5+(leg>2.5?3:0));
ctx.fillRect(2,14+bob,5,5+(leg<2.5?3:0));
ctx.restore();
}

function drawEnemy(e) {
ctx.save(); ctx.translate(e.x, e.y);

if (e.dead) {
var prog = 1 - e.deadTimer / 22;
ctx.scale(1 + prog*0.6, 1 - prog*0.75);
ctx.globalAlpha = 1 - prog*0.7;
ctx.fillStyle = ‘#cc2244’;

ctx.beginPath(); ctx.moveTo(1,-1); ctx.lineTo(-3,3); ctx.stroke();

ctx.beginPath(); ctx.moveTo(8,-1); ctx.lineTo(4,3); ctx.stroke();
ctx.globalAlpha = 1;

ctx.strokeStyle=’#111’; ctx.lineWidth=1.5;
ctx.beginPath(); ctx.moveTo(1,-5); ctx.lineTo(7,-4); ctx.stroke();
ctx.beginPath(); ctx.arc(3,2.5,3,0.1,Math.PI-0.1); ctx.stroke();
var arm=Math.sin(t*0.2)*7;

var leg=Math.abs(Math.sin(t*0.25));

}

ctx.globalAlpha=0.2;
bgBlds.forEach(function(b){
ctx.fillStyle=lvl>=2?’#334’:’#4a7a4a’;
var by=(b.h+bgY*0.4)%H;
ctx.fillRect(b.x-b.w/2,by,b.w,b.h);
}); ctx.globalAlpha=1;

walls.forEach(function(w){
w.segs.forEach(function(s){
var g2=ctx.createLinearGradient(0,w.y,0,w.y+WALL_THICK);
g2.addColorStop(0,th.wallH); g2.addColorStop(1,th.wall);
ctx.fillStyle=g2; ctx.fillRect(s.x,w.y,s.w,WALL_THICK);
ctx.fillStyle=‘rgba(255,255,255,0.22)’; ctx.fillRect(s.x,w.y,s.w,3);
ctx.fillStyle=‘rgba(0,0,0,0.1)’;
for(var bx=s.x;bx<s.x+s.w;bx+=14) ctx.fillRect(bx,w.y,7,WALL_THICK);
});
ctx.shadowColor=th.wallH; ctx.shadowBlur=6;
var prev=0;
w.segs.forEach(function(s){
if(s.x>prev+2){ ctx.fillStyle=th.wallH+‘aa’; ctx.fillRect(s.x-2,w.y,2,WALL_THICK); ctx.fillRect(prev,w.y,2,WALL_THICK); }
prev=s.x+s.w;
});
if(prev<W-2){ ctx.fillStyle=th.wallH+‘aa’; ctx.fillRect(prev-2,w.y,2,WALL_THICK); }
ctx.shadowBlur=0;
});

items.forEach(function(it){
var pulse=1+0.13*Math.sin(it.tw);
ctx.save(); ctx.translate(it.x,it.y); ctx.scale(pulse,pulse);
var em=it.type===‘life’?‘❤️’:it.type===‘inv’?‘⭐’:‘💨’;
var col=it.type===‘life’?’#ff4466’:it.type===‘inv’?’#ffdd00’:’#44ccff’;
ctx.shadowColor=col; ctx.shadowBlur=14;
ctx.font=‘22px serif’; ctx.textAlign=‘center’; ctx.textBaseline=‘middle’;
ctx.fillText(em,0,0); ctx.restore();
ctx.fillStyle=col; ctx.font=‘bold 7px monospace’; ctx.textAlign=‘center’;
ctx.fillText(it.type===‘life’?‘LIFE’:it.type===‘inv’?‘STAR’:‘PASS’,it.x,it.y-18);
ctx.textAlign=‘left’;
});

enemies.forEach(drawEnemy);

var show = !(invF>0 && Math.floor(frame/5)%2===0);
if (show) {
if (invF>0)    { ctx.shadowColor=’#ffdd00’; ctx.shadowBlur=18; }
if (phaseF>0)  { ctx.shadowColor=’#44ccff’; ctx.shadowBlur=14; }
drawObachan(PL.x, PL.y, 1, PL.animT);
ctx.shadowBlur=0;
}

particles.forEach(function(p){
ctx.globalAlpha=p.life/p.max; ctx.fillStyle=p.col;
ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
}); ctx.globalAlpha=1;

drawHUD(th);
if (STATE===‘over’) drawGameOver(th);
}

function drawHUD(th) {
ctx.font=‘18px serif’; ctx.textAlign=‘left’;
ctx.fillText(‘❤️’.repeat(Math.max(0,lives)),8,28);
ctx.font=‘bold 12px monospace’; ctx.fillStyle=th.accent; ctx.textAlign=‘right’;
ctx.shadowColor=th.accent; ctx.shadowBlur=6;
ctx.fillText(Math.floor(score)+‘m’,W-8,22); ctx.shadowBlur=0;
ctx.fillStyle=’#999’; ctx.font=‘8px monospace’;
ctx.fillText(‘BEST ‘+Math.floor(best)+‘m’,W-8,34);
var lvc=[’#FFD700’,’#ff8800’,’#00ffaa’,’#7799ff’,’#ff4400’][lvl];
ctx.fillStyle=lvc; ctx.font=‘bold 9px monospace’;
ctx.fillText(‘LV’+lvl+’ ‘+THEMES[lvl].name,W-8,46);
ctx.textAlign=‘left’;
var px=8,py=H-12; ctx.font=‘9px monospace’;
if(invF>0)   { ctx.fillStyle=’#ffdd00’; ctx.fillText(‘⭐’+Math.ceil(invF/60)+‘s’,px,py);   px+=46; }
if(phaseF>0) { ctx.fillStyle=’#44ccff’; ctx.fillText(‘💨’+Math.ceil(phaseF/60)+‘s’,px,py); }
if(lvlFlash>0){
var al=Math.min(1,lvlFlash/30);
ctx.globalAlpha=al;
ctx.fillStyle=‘rgba(0,0,0,0.6)’; ctx.fillRect(0,H/2-50,W,100);
ctx.fillStyle=lvc; ctx.shadowColor=lvc; ctx.shadowBlur=22;
ctx.font=‘bold 24px monospace’; ctx.textAlign=‘center’;
ctx.fillText(‘LEVEL UP!’,W/2,H/2-8);
ctx.font=‘bold 13px monospace’; ctx.fillText(‘LV’+lvl+’ ’+THEMES[lvl].name,W/2,H/2+18);
ctx.shadowBlur=0; ctx.globalAlpha=1; ctx.textAlign=‘left’;
}
}

function drawTitle() {
titleFrame++;
var gr=ctx.createLinearGradient(0,0,0,H);
gr.addColorStop(0,’#1a0a3e’); gr.addColorStop(0.6,’#3d1c72’); gr.addColorStop(1,’#6b2fa0’);
ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
bgStars.forEach(function(s){
ctx.globalAlpha=0.3+0.7*Math.abs(Math.sin(titleFrame*0.02+s.x*0.1));
ctx.fillStyle=’#fff’; ctx.beginPath(); ctx.arc(s.x,s.y*0.65,s.r,0,Math.PI*2); ctx.fill();
}); ctx.globalAlpha=1;
ctx.fillStyle=’#fffde7’; ctx.shadowColor=’#fffde7’; ctx.shadowBlur=20;
ctx.beginPath(); ctx.arc(W-55,52,22,0,Math.PI*2); ctx.fill();
ctx.shadowBlur=0; ctx.fillStyle=’#3d1c72’;
ctx.beginPath(); ctx.arc(W-46,46,16,0,Math.PI*2); ctx.fill();
bgBlds.forEach(function(b){ ctx.fillStyle=’#1a0840’; ctx.fillRect(b.x-b.w/2,H-b.h,b.w,b.h); });
ctx.strokeStyle=’#9944ff’; ctx.lineWidth=2; ctx.shadowColor=’#9944ff’; ctx.shadowBlur=10;
ctx.beginPath(); ctx.moveTo(0,H-60); ctx.lineTo(W,H-60); ctx.stroke(); ctx.shadowBlur=0;
ctx.textAlign=‘center’;
ctx.shadowColor=’#ff44aa’; ctx.shadowBlur=30; ctx.fillStyle=’#ff44aa’; ctx.font=‘bold 44px monospace’;
ctx.fillText(‘のぼれ！’,W/2,H*0.22);
ctx.shadowColor=’#FFD700’; ctx.shadowBlur=25; ctx.fillStyle=’#FFD700’; ctx.font=‘bold 50px monospace’;
ctx.fillText(‘おばちゃん’,W/2,H*0.36); ctx.shadowBlur=0;
drawObachan(W/2,H*0.51,1.5,titleFrame);
var infos=[
{t:‘長押しで上昇！離すと落下’,c:’#ffffcc’},
{t:‘敵を上から踏みつけろ！’,c:’#ffccee’},
{t:‘❤️ライフ  ⭐無敵  💨すり抜け’,c:’#aaffee’},
{t:‘高く登るほどレベルアップ！’,c:’#ffccaa’},
];
var iy=H*0.66; ctx.font=‘10px monospace’;
infos.forEach(function(inf){ ctx.fillStyle=inf.c; ctx.fillText(inf.t,W/2,iy); iy+=18; });
if(best>0){ ctx.fillStyle=’#aaa’; ctx.font=‘9px monospace’; ctx.fillText(‘BEST: ‘+Math.floor(best)+‘m’,W/2,iy+2); iy+=18; }
if(Math.floor(titleFrame/28)%2===0){
ctx.shadowColor=’#fff’; ctx.shadowBlur=12; ctx.fillStyle=’#fff’; ctx.font=‘bold 15px monospace’;
ctx.fillText(‘タップでスタート！’,W/2,iy+10); ctx.shadowBlur=0;
}
ctx.textAlign=‘left’;
}

function drawGameOver(th) {
ctx.fillStyle=‘rgba(0,0,0,0.8)’; ctx.fillRect(0,0,W,H);
ctx.textAlign=‘center’;
ctx.fillStyle=’#ff4466’; ctx.shadowColor=’#ff4466’; ctx.shadowBlur=22;
ctx.font=‘bold 30px monospace’; ctx.fillText(‘ゲームオーバー’,W/2,H/2-65); ctx.shadowBlur=0;
ctx.fillStyle=’#FFD700’; ctx.font=‘bold 16px monospace’;
ctx.fillText(Math.floor(score)+‘m 登った！’,W/2,H/2-18);
ctx.fillStyle=’#aaa’; ctx.font=‘10px monospace’; ctx.fillText(‘BEST: ‘+Math.floor(best)+‘m’,W/2,H/2+8);
ctx.fillStyle=[’#FFD700’,’#ff8800’,’#00ffaa’,’#7799ff’,’#ff4400’][lvl];
ctx.font=‘9px monospace’; ctx.fillText(‘最高 LV’+lvl+’ ‘+THEMES[lvl].name,W/2,H/2+30);
if(Math.floor(frame/28)%2===0){ ctx.fillStyle=’#fff’; ctx.font=‘bold 14px monospace’; ctx.fillText(‘タップでリトライ’,W/2,H/2+70); }
ctx.textAlign=‘left’;
}

// ============================================================
// INPUT
// ============================================================
var tapping = false;
function onDown() {
if (STATE===‘title’){ initGame(); return; }
if (STATE===‘over’) { initGame(); return; }
if (!tapping) { tapping=true; PL.held=true; playJump(); }
}
function onUp() { tapping=false; PL.held=false; }

cv.addEventListener(‘pointerdown’, function(e){ e.preventDefault(); onDown(); });
cv.addEventListener(‘pointerup’,   function(e){ e.preventDefault(); onUp(); });
cv.addEventListener(‘pointercancel’, function(e){ onUp(); });
document.addEventListener(‘keydown’, function(e){ if(e.code===‘Space’||e.code===‘ArrowUp’){e.preventDefault(); onDown();} });
document.addEventListener(‘keyup’,   function(e){ if(e.code===‘Space’||e.code===‘ArrowUp’){e.preventDefault(); onUp();}   });

// ============================================================
// LOOP
// ============================================================
function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>

</body>
</html>
