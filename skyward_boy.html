function getAC() {
  if (!_AC) { try { _AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }

}
function note(freq, type, dur, vol, delay, vibrato) {
  try {
    var a = getAC(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain();
    var t = a.currentTime + (delay||0);
    if (vibrato) {
      var lfo = a.createOscillator(), lfog = a.createGain();
      lfo.frequency.value = 5.5; lfog.gain.value = vibrato;
      lfo.connect(lfog); lfog.connect(o.frequency);
      lfo.start(t); lfo.stop(t+dur+0.1);
    }
    o.type = type||'square'; o.frequency.value = freq||220;
    o.connect(g); g.connect(a.destination);
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(vol||0.08, t+0.015);
    g.gain.setValueAtTime(vol||0.08, t+dur*0.6);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.start(t); o.stop(t+dur+0.05);
  } catch(e){}
}

function playBGM(lv) {
  var bgmIdx = Math.max(0, lv - 1);
  if (bgmLv===lv) return; bgmLv=lv;
  if (bgmTimer){clearTimeout(bgmTimer);bgmTimer=null;}
  var D=BGMS[bgmIdx],a=getAC(); if(!a) return;
  var mLen=D.mel.reduce(function(s,n){return s+n[1];},0);
  var bLen=D.bass.reduce(function(s,n){return s+n[1];},0);
  function bgmLoop(st) {
    if(bgmLv!==lv) return;
    var t=st;
    D.mel.forEach(function(n){ if(n[0]>0) note(n[0],D.mt,n[1]*0.82,D.mv,t-a.currentTime,0); t+=n[1]; });
    t=st;
    var rep=Math.ceil(mLen/bLen);
    for(var r=0;r<rep;r++) D.bass.forEach(function(n){ if(n[0]>0) note(n[0],D.bt,n[1]*0.78,D.bv,t-a.currentTime,0); t+=n[1]; });
    D.kickPat.forEach(function(k){ playKick2(st+k*D.beatUnit-a.currentTime); });
    D.snarePat.forEach(function(k){ playSnare2(st+k*D.beatUnit-a.currentTime); });
    D.hatPat.forEach(function(k){ playHat2(st+k*D.beatUnit-a.currentTime); });
    bgmTimer=setTimeout(function(){ bgmLoop(a.currentTime+0.08); },(mLen-0.25)*1000);
  }
  bgmLoop(a.currentTime+0.08);
}

function hash(n) {
  n = ((n >> 16) ^ n) * 0x45d9f3b;
  n = ((n >> 16) ^ n) * 0x45d9f3b;
  n = (n >> 16) ^ n;
  return (n & 0x7fffffff) / 0x7fffffff;
}

function isWindowLit(seed, f) {
  var period = 20 + (hash(seed * 7 + 1) * 160) | 0;
  var onRatio = 0.4 + hash(seed * 13 + 2) * 0.5;
  var phase = (hash(seed * 31 + 3) * period) | 0;
  var t = (f + phase) % period;
  var lit = (t / period) < onRatio;
  var flickerSeed = (f / 8 | 0) * 999 + seed;
  var flicker = hash(flickerSeed) > 0.97;
  return lit && !flicker;
}

function update(){
  frame++;
  noiseTimer++; if(noiseTimer>4){ regenerateNoise(); noiseTimer=0; }
  if(screenShake>0){ screenShake--; shakeX=(Math.random()-0.5)*4*screenShake/8; shakeY=(Math.random()-0.5)*4*screenShake/8; } else { shakeX=0; shakeY=0; }
  if(STATE!=='play') return;

  lvl=getLevel();
  if(lvl!==lastLvl&&lastLvl>=0){ lvlFlash=90; playLevel(); try{playBGM(lvl);}catch(e){} screenShake=12; }
  lastLvl=lvl;

  PL.x+=PL.vx;
  if(PL.x<PL.w/2){PL.x=PL.w/2;PL.vx=Math.abs(PL.vx);}
  if(PL.x>W-PL.w/2){PL.x=W-PL.w/2;PL.vx=-Math.abs(PL.vx);}
  PL.vx=PL.vx>0?2.4+(lvl-1)*0.2:-(2.4+(lvl-1)*0.2);
  PL.vy=PL.held?PL.vy+(LIFT_VY-PL.vy)*LIFT_K:Math.min(PL.vy+GRAVITY,MAX_FALL);

  var ws=wallSpeed();
  bgScrollY += ws * 0.4;

  for(var i=0;i<walls.length;i++) walls[i].y+=ws;
  for(var i=0;i<enemies.length;i++) enemies[i].y+=ws;
  for(var i=0;i<items.length;i++) items[i].y+=ws;

  var rem=PL.vy,STEP=1.5,maxIt=Math.ceil(Math.abs(PL.vy)/STEP)+2;
  for(var it=0;it<maxIt&&Math.abs(rem)>0.01;it++){
    var dy=rem>0?Math.min(rem,STEP):Math.max(rem,-STEP);
    PL.y+=dy; rem-=dy;
    if(PL.y<PL.h/2){PL.y=PL.h/2;PL.vy=0;rem=0;break;}
    if(phaseF>0) continue;
    var hit=false;
    for(var wi=0;wi<walls.length;wi++){
      var w=walls[wi],wT=w.y,wB=w.y+WALL_THICK,pT=PL.y-PL.h/2,pB=PL.y+PL.h/2;
      if(pB<=wT||pT>=wB||!hitsWall(w.segs,PL.x,PL.w)) continue;
      if(dy>0){PL.y=wT-PL.h/2;PL.vy=ws;}else{PL.y=wB+PL.h/2;PL.vy=0;}
      rem=0;hit=true;break;
    }
    if(hit) break;
  }

  if(PL.y>H+40){doGameOver();return;}
  PL.animT++; score+=ws*0.14;
  if(invF>0)invF--; if(phaseF>0)phaseF--; if(laserF>0)laserF--; if(lvlFlash>0)lvlFlash--;

  if(laserF>0 && frame%18===0){ fireLaser(PL.x, PL.y); }

  wallTimer++; if(wallTimer>=wallGap()){wallTimer=0;walls.push({y:-WALL_THICK,segs:makeWallSegs()});}

  enemyTimer++;
  var eInt=Math.max(54,120-(lvl-1)*15);
  if(enemyTimer>=eInt){
    enemyTimer=0; spawnEnemy();
    if(Math.random()<0.20) spawnEnemy();
    if(lvl>=3&&Math.random()<0.18) spawnEnemy();
    if(lvl>=4&&Math.random()<0.17) spawnEnemy();
    if(lvl>=5&&Math.random()<0.15) spawnEnemy();
  }

  for(var i=0;i<enemies.length;i++){
    var e=enemies[i]; e.x+=e.dir*e.spd;
    if(e.x>e.bx+e.range)e.dir=-1; if(e.x<e.bx-e.range)e.dir=1; e.animT++;
  }

  itemTimer--; if(itemTimer<=0){itemTimer=160+Math.random()*100|0;spawnItem();}
  for(var i=0;i<items.length;i++) items[i].tw+=0.07;

  for(var li=lasers.length-1;li>=0;li--){
    var l=lasers[li];
    l.x+=l.vx; l.y+=l.vy; l.life--;
    if(l.life<=0||l.x<-10||l.x>W+10||l.y<-10||l.y>H+10){ lasers.splice(li,1); continue; }
    for(var ei=enemies.length-1;ei>=0;ei--){
      var e=enemies[ei]; if(e.dead) continue;
      if(Math.abs(l.x-e.x)<16&&Math.abs(l.y-e.y)<16){
        e.dead=true; e.deadTimer=22;
        burst(e.x,e.y,'#FF0',8); burst(e.x,e.y,'#F80',5); score+=50;
        lasers.splice(li,1); break;
      }
    }
  }

  for(var i=enemies.length-1;i>=0;i--){
    var e=enemies[i]; if(e.dead)continue;
    var edx=Math.abs(e.x-PL.x),pBot=PL.y+PL.h/2,eTop=e.y-e.h/2;
    if(edx<18&&PL.vy>0&&pBot>=eTop-4&&pBot<=eTop+18){
      e.dead=true;e.deadTimer=22;PL.vy=-7;
      playJump();burst(e.x,e.y,'#F4A460',10);score+=50;continue;
    }
    if(invF===0&&laserF===0&&edx<20&&Math.abs(PL.y-e.y)<24){
      lives--;invF=160;playHit();burst(PL.x,PL.y,'#FF4444',12);screenShake=10;
      if(lives<=0){doGameOver();return;}
    }
  }
  for(var i=enemies.length-1;i>=0;i--){if(enemies[i].dead){enemies[i].deadTimer--;if(enemies[i].deadTimer<=0)enemies.splice(i,1);}}

  for(var i=items.length-1;i>=0;i--){
    var it=items[i];
    if(Math.abs(it.x-PL.x)<22&&Math.abs(it.y-PL.y)<24){
      playItem();
      if(it.type==='life'){lives=Math.min(lives+1,9);burst(it.x,it.y,'#FF4444',10);}
      if(it.type==='inv'){invF=360;burst(it.x,it.y,'#FFD700',12);}
      if(it.type==='phase'){phaseF=300;burst(it.x,it.y,'#44ccff',12);}
      if(it.type==='laser'){laserF=120;fireLaser(PL.x,PL.y);burst(it.x,it.y,'#FF0',16);burst(it.x,it.y,'#F80',10);}
      items.splice(i,1);
    }
  }

  walls=walls.filter(function(w){return w.y<H+40;});
  enemies=enemies.filter(function(e){return e.y<H+40;});
  items=items.filter(function(it){return it.y<H+40;});
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.18;p.vx*=0.95;p.life--;
    if(p.life<=0)particles.splice(i,1);
  }
  if(score>best)best=score;
}

function doGameOver(){
  STATE='over'; playOver();
  if(bgmTimer){clearTimeout(bgmTimer);bgmTimer=null;} bgmLv=-1;
  screenShake=20; burst(PL.x,PL.y,'#FF4444',20);
}

function getSkyRatio() {
  var ratios = [0, 0.40, 0.54, 0.68, 0.82, 1.00];
  return ratios[Math.min(lvl, 5)];
}

var SKY_COLORS = [
  null,
  ['#3a1c00', '#1a0800'],
  ['#1a3300', '#0d1a00'],
  ['#000820', '#000010'],
  ['#180000', '#0a0000'],
  ['#08000f', '#000005'],
];

function drawScrollingBackground() {
  var th = THEMES[lvl] || THEMES[1];
  var skyRatio = getSkyRatio();
  var skyH = H * skyRatio;
  var sc = SKY_COLORS[lvl] || SKY_COLORS[1];

  var skyGr = ctx.createLinearGradient(0, 0, 0, skyH);
  skyGr.addColorStop(0, sc[0]);
  skyGr.addColorStop(1, sc[1]);
  ctx.fillStyle = skyGr;
  ctx.fillRect(0, 0, W, skyH);

  if (lvl >= 3) {
    var moonY = skyH * 0.25;
    var moonX = W * 0.8;
    var mf = 0.8 + 0.2 * Math.sin(frame * 0.05);
    ctx.fillStyle = 'rgba(255,240,180,' + (mf * 0.95) + ')';
    ctx.shadowColor = '#FFD0A0'; ctx.shadowBlur = 22 * mf;
    ctx.beginPath(); ctx.arc(moonX, moonY, 16, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = sc[0];
    ctx.beginPath(); ctx.arc(moonX + 8, moonY - 4, 13, 0, Math.PI * 2); ctx.fill();
  }

  if (lvl >= 4) {
    var starAlpha = (lvl - 4) * 0.5 + 0.4;
    STARS.forEach(function(s) {
      var tw = 0.5 + 0.5 * Math.sin(s.twinkle + frame * 0.04);
      ctx.globalAlpha = tw * starAlpha * skyRatio;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(s.x, s.y * skyRatio, s.r, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  if (lvl >= 5) {
    var skyAreaH = H * skyRatio;
    SHOOTING_STARS.forEach(function(ss, si) {
      var cycle = 180 + si * 40;
      var localF = (frame + ss.startFrame) % cycle;
      if (localF >= 50) return;
      var progress = localF / 50;
      var startX = ss.x + 80, startY = skyAreaH * 0.05;
      var endX = ss.x - 80, endY = skyAreaH * 0.45;
      var sx = startX + progress * (endX - startX);
      var sy = startY + progress * (endY - startY);
      var tailLen = 10;
      var dx = endX - startX, dy = endY - startY;
      var dist = Math.sqrt(dx*dx + dy*dy);
      var tailX = sx - (dx / dist) * tailLen, tailY = sy - (dy / dist) * tailLen;
      var alpha = progress < 0.7 ? 1 : (1 - progress) / 0.3;
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
      ctx.shadowColor = '#aaddff'; ctx.shadowBlur = 5;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(tailX, tailY); ctx.stroke();
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    });
  }

  if (skyRatio >= 1.0) return;

  var bldTop = skyH;
  var groundGr = ctx.createLinearGradient(0, bldTop, 0, H);
  groundGr.addColorStop(0, sc[1]);
  groundGr.addColorStop(1, '#000000');
  ctx.fillStyle = groundGr;
  ctx.fillRect(0, bldTop, W, H - bldTop);

  var farScrollY = bgScrollY * 0.5;
  BG_BUILDINGS.slice(0, 9).forEach(function(b) {
    var bh = b.h, baseShift = farScrollY % (bh + 40);
    for (var rep = -1; rep <= 1; rep++) {
      var by = H - bh + baseShift + rep * (bh + 40);
      if (by > H || by + bh < bldTop) continue;
      var drawTop = Math.max(by, bldTop), drawH = Math.min(by + bh, H) - drawTop;
      if (drawH <= 0) continue;
      ctx.globalAlpha = 0.35; ctx.fillStyle = '#080500';
      ctx.fillRect(b.x, drawTop, b.w, drawH);
      b.winCols.forEach(function(col, ci) {
        var wx = b.x + 2 + ci * 7;
        if (wx + 3 > b.x + b.w - 2) return;
        col.forEach(function(win, ri) {
          if (!win.exists) return;
          var wy = by + 8 + ri * 10;
          if (wy < bldTop || wy > H - 2) return;
          if (isWindowLit(win.flickSeed, frame)) {
            ctx.globalAlpha = 0.32;
            ctx.fillStyle = WIN_COLORS_FAR[win.colorIdx % WIN_COLORS_FAR.length] + '1)';
            ctx.fillRect(wx, wy, 3, 4);
          }
        });
      });
      ctx.globalAlpha = 1;
    }
  });

  var midScrollY = bgScrollY * 0.8;
  BG_BUILDINGS.slice(9).forEach(function(b) {
    var bh = b.h, baseShift = midScrollY % (bh + 60);
    for (var rep = -1; rep <= 1; rep++) {
      var by = H - bh + baseShift + rep * (bh + 60);
      if (by > H || by + bh < bldTop) continue;
      var drawTop = Math.max(by, bldTop), drawH = Math.min(by + bh, H) - drawTop;
      if (drawH <= 0) continue;
      ctx.globalAlpha = 0.70; ctx.fillStyle = '#030200';
      ctx.fillRect(b.x, drawTop, b.w, drawH);
      if (drawTop === Math.max(by, bldTop) && by >= bldTop) {
        ctx.fillStyle = th.wallH + '55'; ctx.fillRect(b.x, by, b.w, 2);
      }
      b.winCols.forEach(function(col, ci) {
        var wx = b.x + 3 + ci * 8;
        if (wx + 4 > b.x + b.w - 2) return;
        col.forEach(function(win, ri) {
          if (!win.exists) return;
          var wy = by + 10 + ri * 11;
          if (wy < bldTop || wy > H - 2) return;
          if (isWindowLit(win.flickSeed, frame)) {
            ctx.globalAlpha = 0.75;
            ctx.fillStyle = WIN_COLORS_MID[win.colorIdx % WIN_COLORS_MID.length] + '1)';
            ctx.fillRect(wx, wy, 4, 5);
            ctx.globalAlpha = 0.18;
            ctx.fillRect(wx - 1, wy - 1, 6, 7);
          }
        });
      });
      ctx.globalAlpha = 1;
    }
  });

  var poleScrollY = bgScrollY * 1.0, poleTotalH = 280;
  ctx.globalAlpha = 0.80;
  BG_POLES.forEach(function(p, pi) {
    var offset = pi * (poleTotalH / BG_POLES.length);
    var baseShift = (poleScrollY + offset) % poleTotalH;
    for (var rep = -1; rep <= 2; rep++) {
      var poleTopY = H - 50 + baseShift - poleTotalH * rep;
      var poleBotY = poleTopY + 50;
      if (poleTopY > H || poleBotY < bldTop) continue;
      var drawPoleTop = Math.max(poleTopY - 200, bldTop);
      ctx.fillStyle = 'rgba(8,4,0,0.92)';
      ctx.fillRect(p.x - 3, drawPoleTop, 5, Math.min(poleBotY, H) - drawPoleTop);
      var armY = poleTopY - 150;
      if (armY >= bldTop && armY < H) {
        ctx.fillStyle = 'rgba(10,5,0,0.88)'; ctx.fillRect(p.x - 20, armY, 40, 4);
        ctx.fillStyle = 'rgba(70,55,20,0.75)';
        ctx.beginPath(); ctx.arc(p.x - 14, armY + 2, 3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(p.x + 14, armY + 2, 3, 0, Math.PI * 2); ctx.fill();
      }
      var wireY = poleTopY - 148;
      if (wireY >= bldTop && wireY < H) {
        var nextPole = BG_POLES[(pi + 1) % BG_POLES.length];
        ctx.strokeStyle = 'rgba(15,8,0,0.70)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(p.x, wireY); ctx.quadraticCurveTo((p.x + nextPole.x) / 2, wireY + 18, nextPole.x, wireY); ctx.stroke();
      }
    }
  });
  ctx.globalAlpha = 1;
}

function drawLasers(){
  lasers.forEach(function(l){
    var prog=l.life/28;
    ctx.save(); ctx.globalAlpha=prog;
    ctx.strokeStyle='#FF0'; ctx.lineWidth=3; ctx.shadowColor='#FF0'; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.moveTo(l.x,l.y); ctx.lineTo(l.x-l.vx*2.5,l.y-l.vy*2.5); ctx.stroke();
    ctx.strokeStyle='#FFF'; ctx.lineWidth=1.2; ctx.shadowBlur=5;
    ctx.beginPath(); ctx.moveTo(l.x,l.y); ctx.lineTo(l.x-l.vx*1.8,l.y-l.vy*1.8); ctx.stroke();
    ctx.shadowBlur=0; ctx.restore();
  });
}

function drawCRT(th){
  ctx.fillStyle=th.scanline;
  for(var sy=0;sy<H;sy+=3){ ctx.fillRect(0,sy,W,1); }
  ctx.globalAlpha=0.07; ctx.drawImage(noiseCanvas,0,0); ctx.globalAlpha=1;
  var vg=ctx.createRadialGradient(W/2,H/2,H*0.28,W/2,H/2,H*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=th.crt; ctx.fillRect(0,0,W,H);
  if(Math.random()<0.015){ var gy=Math.random()*H|0,gh=1+Math.random()*3|0,gx=(Math.random()-0.5)*8; var id=ctx.getImageData(0,gy,W,gh); ctx.putImageData(id,gx,gy); }
}

function drawWalls(th){
  walls.forEach(function(w){
    w.segs.forEach(function(s){
      ctx.fillStyle=th.wall; ctx.fillRect(s.x,w.y,s.w,WALL_THICK);
      ctx.fillStyle=th.wallH; ctx.fillRect(s.x,w.y,s.w,2);
      ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(s.x,w.y+WALL_THICK-3,s.w,3);
      ctx.fillStyle='rgba(0,0,0,0.2)';
      for(var bx=s.x;bx<s.x+s.w;bx+=16){ ctx.fillRect(bx,w.y,1,WALL_THICK); }
      ctx.fillRect(s.x,w.y+WALL_THICK/2,s.w,1);
      ctx.shadowColor=th.accent; ctx.shadowBlur=4; ctx.fillStyle=th.accent+'88';
      ctx.fillRect(s.x,w.y,2,WALL_THICK); ctx.fillRect(s.x+s.w-2,w.y,2,WALL_THICK); ctx.shadowBlur=0;
    });
  });
}

function drawItems(){
  items.forEach(function(it){
    var pulse=1+0.14*Math.sin(it.tw);
    ctx.save(); ctx.translate(it.x,it.y); ctx.scale(pulse,pulse);
    var em=it.type==='life'?'❤':it.type==='inv'?'★':it.type==='phase'?'◈':'⚡';
    var col=it.type==='life'?'#FF4444':it.type==='inv'?'#FFD700':it.type==='phase'?'#44ccff':'#FFFF00';
    if(it.type==='laser'){
      ctx.rotate(it.tw); ctx.shadowColor='#FFFF00'; ctx.shadowBlur=22;
      for(var di=0;di<8;di++){
        var da=di*Math.PI/4;
        ctx.strokeStyle='rgba(255,255,0,0.5)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(Math.cos(da)*8,Math.sin(da)*8); ctx.lineTo(Math.cos(da)*14,Math.sin(da)*14); ctx.stroke();
      }
    } else { ctx.shadowColor=col; ctx.shadowBlur=16; }
    ctx.fillStyle=col; ctx.font='bold 18px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(em,0,0); ctx.restore();
    ctx.fillStyle=col+'cc'; ctx.font='bold 7px monospace'; ctx.textAlign='center'; ctx.shadowColor=col; ctx.shadowBlur=4;
    ctx.fillText(it.type==='life'?'LIFE':it.type==='inv'?'STAR':it.type==='phase'?'PASS':'BEAM',it.x,it.y-18);
    ctx.shadowBlur=0; ctx.textAlign='left';
  });
}

function drawHUD(th){
  ctx.font='bold 13px monospace'; ctx.textAlign='left';
  var hs=''; for(var i=0;i<Math.max(0,lives);i++) hs+='♥';
  ctx.fillStyle='#FF4444'; ctx.shadowColor='#FF4444'; ctx.shadowBlur=6; ctx.fillText(hs,6,22); ctx.shadowBlur=0;
  ctx.fillStyle=th.accent; ctx.shadowColor=th.accent; ctx.shadowBlur=8; ctx.font='bold 12px monospace'; ctx.textAlign='right';
  ctx.fillText(Math.floor(score)+'m',W-6,20); ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,200,0.45)'; ctx.font='7px monospace'; ctx.fillText('BEST '+Math.floor(best)+'m',W-6,31);
  var lvc=[null,th.accent,'#aadd44','#FFD700','#FF4444','#FF00FF'][lvl]||th.accent;
  ctx.fillStyle=lvc; ctx.shadowColor=lvc; ctx.shadowBlur=4; ctx.font='bold 8px monospace'; ctx.fillText('LV'+lvl+' '+THEMES[lvl].name,W-6,42); ctx.shadowBlur=0; ctx.textAlign='left';
  var px=6,py=H-8; ctx.font='8px monospace';
  if(invF>0){ctx.fillStyle='#FFD700';ctx.shadowColor='#FFD700';ctx.shadowBlur=4;ctx.fillText('★INV:'+Math.ceil(invF/60)+'s',px,py);px+=64;ctx.shadowBlur=0;}
  if(phaseF>0){ctx.fillStyle='#44ccff';ctx.shadowColor='#44ccff';ctx.shadowBlur=4;ctx.fillText('◈PASS:'+Math.ceil(phaseF/60)+'s',px,py);px+=70;ctx.shadowBlur=0;}
  if(laserF>0){ctx.fillStyle='#FFFF00';ctx.shadowColor='#FFFF00';ctx.shadowBlur=6;ctx.fillText('⚡BEAM:'+Math.ceil(laserF/60)+'s',px,py);ctx.shadowBlur=0;}
  if(lvlFlash>0){
    var al=Math.min(1,lvlFlash/30); ctx.globalAlpha=al;
    ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(0,H/2-48,W,96);
    ctx.fillStyle=lvc; ctx.shadowColor=lvc; ctx.shadowBlur=25; ctx.font='bold 22px monospace'; ctx.textAlign='center';
    ctx.fillText('>> LEVEL UP! <<',W/2,H/2-8); ctx.font='bold 11px monospace'; ctx.fillText('LV'+lvl+' '+THEMES[lvl].name,W/2,H/2+16);
    ctx.shadowBlur=0; ctx.globalAlpha=1; ctx.textAlign='left';
  }
}

var titleFrame=0;
function drawTitle(){
  titleFrame++;
  var gr=ctx.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#080400'); gr.addColorStop(0.6,'#120900'); gr.addColorStop(1,'#1a0d00');
  ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
  var savedLvl=lvl; lvl=1;
  var savedBgScroll=bgScrollY; bgScrollY=titleFrame*0.5;
  drawScrollingBackground();
  lvl=savedLvl; bgScrollY=savedBgScroll;
  ctx.textAlign='center';
  ctx.fillStyle='#000'; ctx.font='bold 42px monospace'; ctx.fillText('のぼれ！',W/2+2,H*0.20+2); ctx.fillText('ボーイ',W/2+2,H*0.31+2);
  var fl=0.8+0.2*Math.sin(titleFrame*0.08);
  ctx.fillStyle='rgba(244,164,96,'+fl+')'; ctx.shadowColor='#F4A460'; ctx.shadowBlur=20*fl; ctx.font='bold 42px monospace'; ctx.fillText('のぼれ！',W/2,H*0.20);
  ctx.fillStyle='rgba(255,80,0,'+fl+')'; ctx.shadowColor='#FF5000'; ctx.shadowBlur=28*fl; ctx.font='bold 46px monospace'; ctx.fillText('ボーイ',W/2,H*0.31); ctx.shadowBlur=0;
  ctx.fillStyle='rgba(200,160,80,0.7)'; ctx.font='8px monospace'; ctx.fillText('- KOENJI RETRO ACTION -',W/2,H*0.37);
  var bounce=Math.sin(titleFrame*0.07)*5;
  var savedLvl2=lvl; lvl=1;
  drawBoy(W/2,H*0.52+bounce,1.6,titleFrame,false,false);
  lvl=savedLvl2;
  var infos=[
    {t:'HOLD: 上昇  RELEASE: 落下',c:'rgba(244,164,96,0.9)'},
    {t:'敵を上から踏んで倒せ！',c:'rgba(200,130,60,0.85)'},
    {t:'⚡BEAMで八方向レーザー！',c:'rgba(255,255,0,0.9)'},
    {t:'❤ HP  ★ 無敵  ◈ すり抜け',c:'rgba(180,220,255,0.8)'},
  ];
  var iy=H*0.68; ctx.font='9px monospace';
  infos.forEach(function(inf){ ctx.fillStyle=inf.c; ctx.shadowColor=inf.c; ctx.shadowBlur=4; ctx.fillText(inf.t,W/2,iy); iy+=17; });
  ctx.shadowBlur=0;
  if(best>0){ctx.fillStyle='rgba(150,120,60,0.7)';ctx.font='8px monospace';ctx.fillText('BEST: '+Math.floor(best)+'m',W/2,iy+2);iy+=16;}
  if(Math.floor(titleFrame/22)%2===0){ ctx.fillStyle=THEMES[1].accent; ctx.shadowColor=THEMES[1].accent; ctx.shadowBlur=10; ctx.font='bold 13px monospace'; ctx.fillText('[ PUSH START ]',W/2,iy+10); ctx.shadowBlur=0; }
  ctx.textAlign='left';
  drawCRT(THEMES[1]);
}

function drawGameOver(){
  ctx.fillStyle='rgba(0,0,0,0.82)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#FF4444'; ctx.shadowColor='#FF4444'; ctx.shadowBlur=24; ctx.font='bold 28px monospace'; ctx.fillText('GAME OVER',W/2,H/2-60); ctx.shadowBlur=0;
  var th=THEMES[lvl]||THEMES[1];
  ctx.fillStyle=th.accent; ctx.shadowColor=th.accent; ctx.shadowBlur=12; ctx.font='bold 16px monospace'; ctx.fillText(Math.floor(score)+'m 登った！',W/2,H/2-18); ctx.shadowBlur=0;
  ctx.fillStyle='rgba(200,160,80,0.6)'; ctx.font='9px monospace'; ctx.fillText('BEST: '+Math.floor(best)+'m',W/2,H/2+6);
  var lvc=[null,THEMES[1].accent,'#aadd44','#FFD700','#FF4444','#FF00FF'][lvl]||THEMES[1].accent;
  ctx.fillStyle=lvc; ctx.font='8px monospace'; ctx.fillText('MAX LV'+lvl+' '+THEMES[lvl].name,W/2,H/2+26);
  if(Math.floor(frame/22)%2===0){ ctx.fillStyle=th.accent; ctx.shadowColor=th.accent; ctx.shadowBlur=8; ctx.font='bold 12px monospace'; ctx.fillText('[ PUSH START ]',W/2,H/2+66); ctx.shadowBlur=0; }
  ctx.textAlign='left';
}

function draw(){
  ctx.clearRect(0,0,W,H);
  var th=THEMES[lvl]||THEMES[1];
  if(STATE==='title'){ drawTitle(); return; }
  ctx.save(); ctx.translate(shakeX,shakeY);
  drawScrollingBackground();
  drawWalls(th);
  drawItems();
  enemies.forEach(drawEnemy);
  drawLasers();
  var showPl=!(invF>0&&Math.floor(frame/5)%2===0);
  if(showPl){
    if(invF>0){ctx.shadowColor='#FFD700';ctx.shadowBlur=20;}
    if(phaseF>0){ctx.shadowColor='#44ccff';ctx.shadowBlur=15;}
    if(laserF>0){ctx.shadowColor='#FFFF00';ctx.shadowBlur=18;}
    drawBoy(PL.x,PL.y,1,PL.animT,invF>0,phaseF>0);
    ctx.shadowBlur=0;
  }
  particles.forEach(function(p){ ctx.globalAlpha=p.life/p.max; ctx.fillStyle=p.col; ctx.shadowColor=p.col; ctx.shadowBlur=5; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); }); ctx.globalAlpha=1; ctx.shadowBlur=0;
  ctx.restore();
  drawHUD(th);
  if(STATE==='over') drawGameOver();
  drawCRT(th);
}

var tapping=false;
function onDown(){ try{var a=getAC();if(a&&a.state==='suspended')a.resume();}catch(e){} if(STATE==='title'){initGame();return;} if(STATE==='over'){initGame();return;} if(!tapping){tapping=true;PL.held=true;playJump();} }
function onUp(){ tapping=false; PL.held=false; }
cv.addEventListener('pointerdown',function(e){e.preventDefault();onDown();},{passive:false});
cv.addEventListener('pointerup',function(e){e.preventDefault();onUp();},{passive:false});
cv.addEventListener('pointercancel',function(){onUp();});
document.addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();onDown();}});
document.addEventListener('keyup',function(e){if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();onUp();}});

function gameLoop(){update();draw();requestAnimationFrame(gameLoop);}
requestAnimationFrame(gameLoop);
})();
</script>
</body>
