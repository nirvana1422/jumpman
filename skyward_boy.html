var _AC = null;
function getAC() {
  if (!_AC) { try { _AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
  return _AC;
}
function note(freq, type, dur, vol, delay, vibrato) {
  try {
    var a = getAC(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain();
    var t = a.currentTime + (delay||0);
    if (vibrato) {
      var lfo = a.createOscillator(), lfog = a.createGain();
      lfo.frequency.value = 5.5; lfog.gain.value = vibrato;
      lfo.connect(lfog); lfog.connect(o.frequency);
      lfo.start(t); lfo.stop(t+dur+0.1);
    }
    o.type = type||'square'; o.frequency.value = freq||220;
    o.connect(g); g.connect(a.destination);
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(vol||0.08, t+0.015);
    g.gain.setValueAtTime(vol||0.08, t+dur*0.6);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.start(t); o.stop(t+dur+0.05);
  } catch(e){}
}

}

];
function playBGM(lv) {
  if (bgmLv===lv) return; bgmLv=lv;
  if (bgmTimer){clearTimeout(bgmTimer);bgmTimer=null;}
  var D=BGMS[lv],a=getAC(); if(!a) return;
  var mLen=D.mel.reduce(function(s,n){return s+n[1];},0);
  var bLen=D.bass.reduce(function(s,n){return s+n[1];},0);
  function bgmLoop(st) {
    if(bgmLv!==lv) return;
    var t=st;
    D.mel.forEach(function(n){ if(n[0]>0) note(n[0],D.mt,n[1]*0.82,D.mv,t-a.currentTime,0); t+=n[1]; });
    t=st;
    var rep=Math.ceil(mLen/bLen);
    for(var r=0;r<rep;r++) D.bass.forEach(function(n){ if(n[0]>0) note(n[0],D.bt,n[1]*0.78,D.bv,t-a.currentTime,0); t+=n[1]; });
    D.kickPat.forEach(function(k){ playKick2(st+k*D.beatUnit-a.currentTime); });
    D.snarePat.forEach(function(k){ playSnare2(st+k*D.beatUnit-a.currentTime); });
    D.hatPat.forEach(function(k){ playHat2(st+k*D.beatUnit-a.currentTime); });
    bgmTimer=setTimeout(function(){ bgmLoop(a.currentTime+0.08); },(mLen-0.25)*1000);
  }
  bgmLoop(a.currentTime+0.08);
}

// ============================================================
// STATE
// ============================================================
var STATE='title', frame=0, score=0, best=0;
var lives=3, invF=0, phaseF=0, laserF=0;

// ============================================================
// PLAYER
// ============================================================
var PL={ x:W/2, y:H*0.7, w:24, h:30, vy:0, vx:2.4, held:false, animT:0 };

// ============================================================
// WALLS / ENEMIES / ITEMS
// ============================================================
var walls=[], wallTimer=0;
var enemies=[], enemyTimer=0;
var items=[], itemTimer=200;

function wallSpeed(){ return 1.3+lvl*0.5+score*0.0001; }
function wallGap()  { return Math.max(50,100-lvl*8); }
function getLevel(){
  if(score>=5000) return 4;
  if(score>=2500) return 3;
  if(score>=1000) return 2;
  if(score>=400)  return 1;
  return 0;
}
function makeWallSegs(){
  var segs=[],r=Math.random();
  if(r<0.30){ var gw=85+Math.random()*65,gx=10+Math.random()*(W-20-gw); if(gx>0)segs.push({x:0,w:gx}); if(gx+gw<W)segs.push({x:gx+gw,w:W-(gx+gw)}); }
  else if(r<0.55){ var g1w=65+Math.random()*35,g1x=8+Math.random()*50,gap=18+Math.random()*30,g2x=g1x+g1w+gap,g2w=65+Math.random()*35; if(g2x+g2w>W-8)g2w=W-8-g2x; if(g2w<50)return makeWallSegs(); if(g1x>0)segs.push({x:0,w:g1x}); if(gap>0)segs.push({x:g1x+g1w,w:gap}); if(g2x+g2w<W)segs.push({x:g2x+g2w,w:W-(g2x+g2w)}); }
  else if(r<0.68){ segs.push({x:0,w:12+Math.random()*40}); }
  else if(r<0.80){ var sw=12+Math.random()*40; segs.push({x:W-sw,w:sw}); }
  else if(r<0.90){ var cw=35+Math.random()*70,cx=(W-cw)/2+(Math.random()-0.5)*50; cx=Math.max(50,Math.min(W-50-cw,cx)); segs.push({x:cx,w:cw}); }
  else{ var gw2=140+Math.random()*80; if(gw2>W-20)gw2=W-20; var gx2=10+Math.random()*(W-20-gw2); if(gx2>0)segs.push({x:0,w:gx2}); if(gx2+gw2<W)segs.push({x:gx2+gw2,w:W-(gx2+gw2)}); }
  return segs;
}
function hitsWall(segs,px,pw){
  if(phaseF>0) return false;
  var pl=px-pw/2+4,pr=px+pw/2-4;
  for(var i=0;i<segs.length;i++){if(pr>segs[i].x+2&&pl<segs[i].x+segs[i].w-2)return true;}
  return false;
}
function spawnEnemy(){
  var x=30+Math.random()*(W-60);
  enemies.push({x:x,y:-35,w:26,h:24,bx:x,range:30+Math.random()*80,
    dir:Math.random()<0.5?1:-1,spd:0.7+Math.random()*1.4+lvl*0.35,
    animT:Math.random()*60|0,dead:false,deadTimer:0,
    eyeType:Math.floor(Math.random()*4),
    col:['#cc3300','#aa2200','#dd4411','#bb3300'][Math.floor(Math.random()*4)]});
}
function spawnItem(){
  var w=Math.random();
  var t;
  if(w<0.38) t='life';
  else if(w<0.62) t='inv';
  else if(w<0.82) t='phase';
  else t='laser'; // ★新アイテム
  items.push({x:30+Math.random()*(W-60),y:-20,type:t,tw:0});
}
function burst(x,y,col,n){
  for(var i=0;i<(n||8);i++){
    var a2=Math.random()*Math.PI*2,s=1.5+Math.random()*4;
    particles.push({x:x,y:y,vx:Math.cos(a2)*s,vy:Math.sin(a2)*s-2,life:28,max:28,col:col,r:1.5+Math.random()*3});
  }
}

// レーザー発射
function fireLaser(x,y){
  playLaser();
  for(var d=0;d<8;d++){
    var angle=d*Math.PI/4;
    lasers.push({x:x,y:y,vx:Math.cos(angle)*14,vy:Math.sin(angle)*14,life:28,angle:angle});
  }
  screenShake=8;
  burst(x,y,'#FF0','16');
  burst(x,y,'#F80',10);
}

var bgY=0;

for(var bi=0;bi<14;bi++) bgBlds.push({x:Math.random()*W,w:12+Math.random()*50,h:30+Math.random()*160,win:Math.random(),style:Math.floor(Math.random()*3)});
var bgWires=[];
for(var wi2=0;wi2<5;wi2++) bgWires.push({y:80+wi2*90,sag:8+Math.random()*15,xOff:Math.random()*30+20});
var bgSigns=[{x:20,y:120,text:'古着'},{x:W-70,y:200,text:'BAR'},{x:40,y:320,text:'レコード'},{x:W-60,y:80,text:'純喫茶'},{x:W/2-30,y:420,text:'中古'}];
var noiseCanvas=document.createElement('canvas');
noiseCanvas.width=W; noiseCanvas.height=H;
var noiseCtx=noiseCanvas.getContext('2d');
function regenerateNoise(){
  var id=noiseCtx.createImageData(W,H); var d=id.data;
  for(var i=0;i<d.length;i+=4){ var v=Math.random()*40|0; d[i]=v;d[i+1]=v;d[i+2]=v;d[i+3]=Math.random()>0.85?18:0; }
  noiseCtx.putImageData(id,0,0);
}
regenerateNoise();
var noiseTimer=0;

// ============================================================
// INIT
// ============================================================
function initGame(){
  STATE='play'; frame=0; score=0;
  lives=3; invF=0; phaseF=0; laserF=0; lvl=0; lastLvl=-1; lvlFlash=0;
  particles=[]; lasers=[];
  walls=[]; wallTimer=0; enemies=[]; enemyTimer=0; items=[]; itemTimer=200;
  PL.x=W/2; PL.y=H*0.7; PL.vy=0; PL.vx=2.4; PL.held=false; PL.animT=0;
  bgY=0; bgmLv=-1; screenShake=0;
  setTimeout(function(){ try{playBGM(0);}catch(e){} },50);
}

// ============================================================
// UPDATE
// ============================================================
function update(){
  frame++;
  noiseTimer++; if(noiseTimer>4){ regenerateNoise(); noiseTimer=0; }
  if(screenShake>0){ screenShake--; shakeX=(Math.random()-0.5)*4*screenShake/8; shakeY=(Math.random()-0.5)*4*screenShake/8; } else { shakeX=0; shakeY=0; }
  if(STATE!=='play') return;

  lvl=getLevel();
  if(lvl!==lastLvl&&lastLvl>=0){ lvlFlash=90; playLevel(); try{playBGM(lvl);}catch(e){} screenShake=12; }
  lastLvl=lvl;

  PL.x+=PL.vx;
  if(PL.x<PL.w/2){PL.x=PL.w/2;PL.vx=Math.abs(PL.vx);}
  if(PL.x>W-PL.w/2){PL.x=W-PL.w/2;PL.vx=-Math.abs(PL.vx);}
  PL.vx=PL.vx>0?2.4+lvl*0.2:-(2.4+lvl*0.2);
  PL.vy=PL.held?PL.vy+(LIFT_VY-PL.vy)*LIFT_K:Math.min(PL.vy+GRAVITY,MAX_FALL);

  var ws=wallSpeed();
  for(var i=0;i<walls.length;i++) walls[i].y+=ws;
  for(var i=0;i<enemies.length;i++) enemies[i].y+=ws;
  for(var i=0;i<items.length;i++) items[i].y+=ws;

  var rem=PL.vy,STEP=1.5,maxIt=Math.ceil(Math.abs(PL.vy)/STEP)+2;
  for(var it=0;it<maxIt&&Math.abs(rem)>0.01;it++){
    var dy=rem>0?Math.min(rem,STEP):Math.max(rem,-STEP);
    PL.y+=dy; rem-=dy;
    if(PL.y<PL.h/2){PL.y=PL.h/2;PL.vy=0;rem=0;break;}
    if(phaseF>0) continue;
    var hit=false;
    for(var wi=0;wi<walls.length;wi++){
      var w=walls[wi],wT=w.y,wB=w.y+WALL_THICK,pT=PL.y-PL.h/2,pB=PL.y+PL.h/2;
      if(pB<=wT||pT>=wB||!hitsWall(w.segs,PL.x,PL.w)) continue;
      if(dy>0){PL.y=wT-PL.h/2;PL.vy=ws;}else{PL.y=wB+PL.h/2;PL.vy=0;}
      rem=0;hit=true;break;
    }
    if(hit) break;
  }

  if(PL.y>H+40){doGameOver();return;}
  PL.animT++; score+=ws*0.14; bgY=(bgY+ws*0.4)%H;
  if(invF>0)invF--; if(phaseF>0)phaseF--; if(laserF>0)laserF--; if(lvlFlash>0)lvlFlash--;

  // レーザー持続中: 定期発射
  if(laserF>0 && frame%18===0){
    fireLaser(PL.x, PL.y);
  }

  wallTimer++; if(wallTimer>=wallGap()){wallTimer=0;walls.push({y:-WALL_THICK,segs:makeWallSegs()});}

  enemyTimer++;
  var eInt=Math.max(54,120-lvl*15);
  if(enemyTimer>=eInt){
    enemyTimer=0;
    spawnEnemy();
    if(Math.random()<0.20) spawnEnemy();
    if(lvl>=2&&Math.random()<0.18) spawnEnemy();
    if(lvl>=3&&Math.random()<0.17) spawnEnemy();
    if(lvl>=4&&Math.random()<0.15) spawnEnemy();
  }

  for(var i=0;i<enemies.length;i++){
    var e=enemies[i]; e.x+=e.dir*e.spd;
    if(e.x>e.bx+e.range)e.dir=-1; if(e.x<e.bx-e.range)e.dir=1; e.animT++;
  }

  itemTimer--; if(itemTimer<=0){itemTimer=160+Math.random()*100|0;spawnItem();}
  for(var i=0;i<items.length;i++) items[i].tw+=0.07;

  // レーザー更新＆敵当たり判定
  for(var li=lasers.length-1;li>=0;li--){
    var l=lasers[li];
    l.x+=l.vx; l.y+=l.vy; l.life--;
    if(l.life<=0||l.x<-10||l.x>W+10||l.y<-10||l.y>H+10){ lasers.splice(li,1); continue; }
    // レーザーが敵に当たる
    for(var ei=enemies.length-1;ei>=0;ei--){
      var e=enemies[ei]; if(e.dead) continue;
      if(Math.abs(l.x-e.x)<16&&Math.abs(l.y-e.y)<16){
        e.dead=true; e.deadTimer=22;
        burst(e.x,e.y,'#FF0',8); burst(e.x,e.y,'#F80',5); score+=50;
        lasers.splice(li,1); break;
      }
    }
  }

  for(var i=enemies.length-1;i>=0;i--){
    var e=enemies[i]; if(e.dead)continue;
    var edx=Math.abs(e.x-PL.x),pBot=PL.y+PL.h/2,eTop=e.y-e.h/2;
    if(edx<18&&PL.vy>0&&pBot>=eTop-4&&pBot<=eTop+18){
      e.dead=true;e.deadTimer=22;PL.vy=-7;
      playJump();burst(e.x,e.y,'#F4A460',10);score+=50;continue;
    }
    if(invF===0&&laserF===0&&edx<20&&Math.abs(PL.y-e.y)<24){
      lives--;invF=160;playHit();burst(PL.x,PL.y,'#FF4444',12);screenShake=10;
      if(lives<=0){doGameOver();return;}
    }
  }
  for(var i=enemies.length-1;i>=0;i--){if(enemies[i].dead){enemies[i].deadTimer--;if(enemies[i].deadTimer<=0)enemies.splice(i,1);}}

  for(var i=items.length-1;i>=0;i--){
    var it=items[i];
    if(Math.abs(it.x-PL.x)<22&&Math.abs(it.y-PL.y)<24){
      playItem();
      if(it.type==='life'){lives=Math.min(lives+1,9);burst(it.x,it.y,'#FF4444',10);}
      if(it.type==='inv'){invF=360;burst(it.x,it.y,'#FFD700',12);}
      if(it.type==='phase'){phaseF=300;burst(it.x,it.y,'#44ccff',12);}
      if(it.type==='laser'){
        laserF=120; // 2秒間
        fireLaser(PL.x,PL.y); // 即発射
        burst(it.x,it.y,'#FF0',16); burst(it.x,it.y,'#F80',10);
      }
      items.splice(i,1);
    }
  }

  walls=walls.filter(function(w){return w.y<H+40;});
  enemies=enemies.filter(function(e){return e.y<H+40;});
  items=items.filter(function(it){return it.y<H+40;});
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.18;p.vx*=0.95;p.life--;
    if(p.life<=0)particles.splice(i,1);
  }
  if(score>best)best=score;
}

function doGameOver(){
  STATE='over'; playOver();
  if(bgmTimer){clearTimeout(bgmTimer);bgmTimer=null;} bgmLv=-1;
  screenShake=20; burst(PL.x,PL.y,'#FF4444',20);
}

// Lv4: アフロヘアのファンク男
function drawBoyFunk(x,y,sc,animT,isInv,isPhase){
  sc=sc||1; ctx.save(); ctx.translate(x,y); ctx.scale(sc,sc);
  var bob=Math.sin(animT*0.18)*1.8, run=Math.sin(animT*0.22);
  ctx.globalAlpha=isPhase?0.65:1.0;

  // 足（ベルボトム！）
  var legL=Math.abs(run)*7, legR=(1-Math.abs(run))*7;
  // 鮮やかなパープル
  ctx.fillStyle='#5500aa';
  // ベルボトムは下が広がる
  ctx.beginPath(); ctx.moveTo(-10,11+bob); ctx.lineTo(-2,11+bob); ctx.lineTo(-1,18+bob+legL*0.3); ctx.lineTo(-13,24+bob+legL*0.3); ctx.lineTo(-14,18+bob); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(2,11+bob); ctx.lineTo(10,11+bob); ctx.lineTo(14,18+bob); ctx.lineTo(13,24+bob+legR*0.3); ctx.lineTo(1,18+bob+legR*0.3); ctx.closePath(); ctx.fill();
  // ベルボトムのフレア縁
  ctx.strokeStyle='#aa44ff'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(-14,20+bob+legL*0.2); ctx.lineTo(-1,18+bob+legL*0.3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(14,20+bob+legR*0.2); ctx.lineTo(1,18+bob+legR*0.3); ctx.stroke();
  // プラットフォームシューズ
  ctx.fillStyle='#2a0055'; ctx.beginPath(); ctx.ellipse(-7,26+bob+legL*0.3,8,3.5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.ellipse(-7,24+bob+legL*0.3,7,2,0,0,Math.PI*2); ctx.fill(); // ソール
  ctx.fillStyle='#2a0055'; ctx.beginPath(); ctx.ellipse(7,26+bob+legR*0.3,8,3.5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.ellipse(7,24+bob+legR*0.3,7,2,0,0,Math.PI*2); ctx.fill();

  // シャツ（ファンキー）
  // オープンカラー・でかいえり
  ctx.fillStyle='#ff8800';
  ctx.beginPath(); ctx.moveTo(-13,-3+bob); ctx.lineTo(13,-3+bob); ctx.lineTo(14,11+bob); ctx.lineTo(-14,11+bob); ctx.closePath(); ctx.fill();
  // 幾何学プリント
  ctx.fillStyle='rgba(255,255,0,0.5)';
  ctx.beginPath(); ctx.arc(-6,3+bob,4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5,5+bob,3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(0,8+bob,2.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,0,200,0.4)';
  ctx.beginPath(); ctx.moveTo(-2,-1+bob); ctx.lineTo(2,-1+bob); ctx.lineTo(0,3+bob); ctx.closePath(); ctx.fill();
  // でかいえり（開け気味）
  ctx.fillStyle='#ee7700';
  ctx.beginPath(); ctx.moveTo(-1,-3+bob); ctx.lineTo(-9,5+bob); ctx.lineTo(-9,-3+bob); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(1,-3+bob); ctx.lineTo(9,5+bob); ctx.lineTo(9,-3+bob); ctx.closePath(); ctx.fill();
  // 胸毛（サービス）
  ctx.strokeStyle='rgba(80,40,10,0.6)'; ctx.lineWidth=0.8;
  [[-3,1],[-1,2],[1,1],[3,2],[-2,3],[2,3]].forEach(function(p){
    ctx.beginPath(); ctx.arc(p[0],p[1]+bob,1.5,-0.5,Math.PI+0.5); ctx.stroke();
  });

  // 頭（同じキモカワ）
  ctx.fillStyle='#D4A070'; ctx.beginPath(); ctx.arc(0,-14+bob,13,0,Math.PI*2); ctx.fill();

  // ★アフロヘア（でかい！）
  ctx.fillStyle='#1a0a00';
  ctx.shadowColor='#3a2010'; ctx.shadowBlur=5;
  ctx.beginPath(); ctx.arc(0,-20+bob,20,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  // アフロのテクスチャ（くるくる）
  ctx.strokeStyle='#2a1808'; ctx.lineWidth=1.2;
  for(var ai=0;ai<16;ai++){
    var aa=ai*Math.PI/8;
    var ar=14+Math.sin(ai*2.1)*3.5;
    var ax=Math.cos(aa)*ar, ay=-20+bob+Math.sin(aa)*ar;
    ctx.beginPath(); ctx.arc(ax,ay,2+Math.sin(ai)*1,0,Math.PI*2); ctx.stroke();
  }
  // アフロのつや（ハイライト）
  ctx.fillStyle='rgba(80,50,20,0.25)'; ctx.beginPath(); ctx.ellipse(-5,-26+bob,8,5,-0.3,0,Math.PI*2); ctx.fill();
  // アフロピック（くし）が刺さってる
  ctx.fillStyle='#ff8800'; ctx.fillRect(8,-35+bob,2,16); ctx.fillRect(3,-35+bob,2,13); ctx.fillRect(13,-33+bob,2,12);
  ctx.fillStyle='#ffaa00';
  ctx.beginPath(); ctx.arc(9,-36+bob,2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4,-36+bob,2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(14,-34+bob,2,0,Math.PI*2); ctx.fill();

  // 眉（太め）
  ctx.fillStyle='#1a0a00';
  ctx.save(); ctx.translate(-4,-19.5+bob); ctx.rotate(-0.15); ctx.fillRect(-3.5,-1.2,7,2.5); ctx.restore();
  ctx.save(); ctx.translate(4,-19.5+bob); ctx.rotate(0.15); ctx.fillRect(-3.5,-1.2,7,2.5); ctx.restore();
  // 白目
  ctx.fillStyle='#f5f0e0'; ctx.beginPath(); ctx.ellipse(-4,-14+bob,4.5,5,0,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(4,-14+bob,4.5,5,0,0,Math.PI*2); ctx.fill();
  // 黒目（ノリノリ）
  ctx.fillStyle='#1a0800'; ctx.beginPath(); ctx.arc(-4,-14+bob,3.2,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(4,-14+bob,3.2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-3,-15.2+bob,1.1,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(5,-15.2+bob,1.1,0,Math.PI*2); ctx.fill();
  // 鼻
  ctx.fillStyle='#c08060'; ctx.beginPath(); ctx.arc(0,-10+bob,3.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#a06040'; ctx.beginPath(); ctx.arc(-1.2,-10+bob,1.2,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(1.8,-10+bob,1.2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(200,80,40,0.22)'; ctx.beginPath(); ctx.ellipse(-8,-11+bob,4.5,3,0,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(8,-11+bob,4.5,3,0,0,Math.PI*2); ctx.fill();
  // 口（ニヤり）
  ctx.strokeStyle='#8B4513'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(-5,-6.5+bob); ctx.quadraticCurveTo(0,-3.5+bob,5,-6.5+bob); ctx.stroke();
  // 八重歯
  ctx.fillStyle='#f0ead8'; ctx.fillRect(-1.5,-7.5+bob,2,2.5);
  // 耳＋でかいイヤリング
  ctx.fillStyle='#D4A070'; ctx.beginPath(); ctx.arc(-13,-13+bob,3.5,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(13,-13+bob,3.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#c08060'; ctx.beginPath(); ctx.arc(-13,-13+bob,1.8,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(13,-13+bob,1.8,0,Math.PI*2); ctx.fill();
  // 大きいリングイヤリング
  ctx.strokeStyle='#FFD700'; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.arc(-13,-8+bob,5,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(13,-8+bob,5,0,Math.PI*2); ctx.stroke();
  // 腕
  var armL2=run*8, armR2=-run*8;
  ctx.fillStyle='#ff8800'; ctx.beginPath(); ctx.arc(-14,3+bob+armL2*0.3,5.5,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(14,3+bob+armR2*0.3,5.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#D4A070'; ctx.beginPath(); ctx.arc(-14,9+bob+armL2*0.4,4,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(14,9+bob+armR2*0.4,4,0,Math.PI*2); ctx.fill();
  // 手首バングル
  ctx.strokeStyle='#FFD700'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(-14,7+bob+armL2*0.4,4,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(14,7+bob+armR2*0.4,4,0,Math.PI*2); ctx.stroke();

  // レーザー中は光るオーラ
  if(laserF>0){
    var pulse=0.5+0.5*Math.sin(frame*0.25);
    ctx.strokeStyle='rgba(255,200,0,'+pulse+')'; ctx.lineWidth=3;
    ctx.shadowColor='#FF0'; ctx.shadowBlur=18;
    ctx.beginPath(); ctx.arc(0,-5+bob,26,0,Math.PI*2); ctx.stroke(); ctx.shadowBlur=0;
  }
  if(isInv&&Math.floor(frame/3)%2===0){ ctx.strokeStyle='#FFD700'; ctx.lineWidth=2; ctx.shadowColor='#FFD700'; ctx.shadowBlur=14; ctx.beginPath(); ctx.arc(0,-2+bob,22,0,Math.PI*2); ctx.stroke(); ctx.shadowBlur=0; }
  ctx.globalAlpha=1; ctx.restore();
}

function drawBoy(x,y,sc,animT,isInv,isPhase){
  if(lvl<=1) drawBoyKimokawa(x,y,sc,animT,isInv,isPhase);
  else if(lvl===2) drawBoyFurugiya(x,y,sc,animT,isInv,isPhase);
  else if(lvl===3) drawBoyYakuza(x,y,sc,animT,isInv,isPhase);
  else             drawBoyFunk(x,y,sc,animT,isInv,isPhase);
}

function drawHeartSmall(cx,cy,size,c){
  c.save(); c.translate(cx,cy); c.scale(size*0.12,size*0.12);
  c.beginPath(); c.moveTo(0,5); c.bezierCurveTo(-5,-2,-8,1,-8,3); c.bezierCurveTo(-8,7,-4,10,0,14); c.bezierCurveTo(4,10,8,7,8,3); c.bezierCurveTo(8,1,5,-2,0,5); c.closePath(); c.fill(); c.restore();
}
function drawEnemy(e){
  ctx.save(); ctx.translate(e.x,e.y);
  if(e.dir<0) ctx.scale(-1,1);
  if(e.dead){
    var prog=1-e.deadTimer/22;
    ctx.scale(1+prog*0.8,1-prog*0.8); ctx.globalAlpha=1-prog*0.9;
    ctx.fillStyle='#cc3300'; ctx.beginPath(); ctx.ellipse(0,2,14,4,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ff6600'; ctx.beginPath(); ctx.ellipse(0,1,10,3,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#ffff00'; ctx.lineWidth=1.5;
    [[-4,-1,0,3],[0,-1,-4,3],[3,-1,7,3],[7,-1,3,3]].forEach(function(l){ ctx.beginPath();ctx.moveTo(l[0],l[1]);ctx.lineTo(l[2],l[3]);ctx.stroke(); });
    ctx.globalAlpha=1; ctx.restore(); return;
  }
  var t=e.animT, hov=Math.sin(t*0.12)*3;
  ctx.fillStyle='rgba(255,100,0,0.18)'; ctx.beginPath(); ctx.ellipse(0,8+hov,16,5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=e.col; ctx.beginPath(); ctx.ellipse(0,3+hov,13,5,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(255,200,100,0.5)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.ellipse(0,4+hov,11,3.5,0,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='#cc2200'; ctx.beginPath(); ctx.arc(0,-2+hov,9,Math.PI,0); ctx.fill();
  ctx.fillStyle='#ff4422'; ctx.beginPath(); ctx.arc(0,-2+hov,7,Math.PI,0); ctx.fill();
  ctx.fillStyle='rgba(255,200,180,0.25)'; ctx.beginPath(); ctx.ellipse(-2,-4+hov,4,2.5,-0.4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#111';
  if(e.eyeType===0){
    ctx.beginPath(); ctx.arc(-3.5,-2+hov,3.2,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(3.5,-2+hov,3.2,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#ff8800'; ctx.lineWidth=0.8; ctx.beginPath(); ctx.arc(-3.5,-2+hov,2,0,Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.arc(3.5,-2+hov,2,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='#ff4400'; ctx.beginPath(); ctx.arc(-3.5,-2+hov,0.8,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(3.5,-2+hov,0.8,0,Math.PI*2); ctx.fill();
  } else if(e.eyeType===1){
    ctx.fillStyle='#ff2244'; drawHeartSmall(-3.5,-3.5+hov,2.2,ctx); drawHeartSmall(3.5,-3.5+hov,2.2,ctx);
  } else if(e.eyeType===2){
    ctx.fillStyle='#ffff00'; ctx.beginPath(); ctx.ellipse(-3.5,-2+hov,3.5,2,0.3,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(3.5,-2+hov,3.5,2,-0.3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(-3,-2+hov,1.5,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(4,-2+hov,1.5,0,Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle='#fff8dc'; ctx.beginPath(); ctx.ellipse(-3.5,-2.5+hov,4,4.5,0,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(3.5,-2.5+hov,4,4.5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#550000'; ctx.beginPath(); ctx.arc(-3,-2+hov,2.5,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(4,-2+hov,2.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-2,-3+hov,1,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(5,-3+hov,1,0,Math.PI*2); ctx.fill();
  }
  ctx.strokeStyle='#ff8800'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(-4,2+hov); ctx.quadraticCurveTo(0,5+hov,4,2+hov); ctx.stroke();
  ctx.fillStyle='#fff8dc'; ctx.fillRect(-2,2.5+hov,1.5,2.5); ctx.fillRect(1,2.5+hov,1.5,2.5);
  if(Math.floor(t/20)%3===0){
    var bg=ctx.createLinearGradient(0,6+hov,0,25+hov); bg.addColorStop(0,'rgba(255,150,0,0.6)'); bg.addColorStop(1,'rgba(255,100,0,0)');
    ctx.fillStyle=bg; ctx.beginPath(); ctx.moveTo(-5,6+hov); ctx.lineTo(5,6+hov); ctx.lineTo(8,25+hov); ctx.lineTo(-8,25+hov); ctx.closePath(); ctx.fill();
  }
  ctx.strokeStyle='#ff4422'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(-2,-9+hov); ctx.lineTo(-5,-16+hov); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2,-9+hov); ctx.lineTo(6,-16+hov); ctx.stroke();
  ctx.fillStyle='#ffcc00'; ctx.beginPath(); ctx.arc(-5,-17+hov,2.5,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(6,-17+hov,2.5,0,Math.PI*2); ctx.fill();

function drawRetroCity(th){
  ctx.globalAlpha=0.35;
  bgBlds.slice(0,7).forEach(function(b){
    var by=((b.h+bgY*0.15)%H);
    ctx.fillStyle='#0a0500'; ctx.fillRect(b.x-b.w*0.5,H-by,b.w*0.7,by);
    if(b.win>0.3){
      for(var wy=H-by+6;wy<H-6;wy+=14){

      }
    }
  });
  ctx.globalAlpha=0.65;
  bgBlds.slice(7).forEach(function(b){
    var by=((b.h+bgY*0.3)%H);
    ctx.fillStyle='#050200'; ctx.fillRect(b.x-b.w*0.6,H-by,b.w,by);
    if(b.win>0.25){
      for(var wy=H-by+8;wy<H-8;wy+=12){
        if(Math.sin(b.x*0.4+wy*0.7+frame*0.02)>0){ ctx.fillStyle=th.accent+'66'; ctx.fillRect(b.x-b.w*0.25,wy,5,6); }
      }
    }
    if(b.style===0&&b.h>80){ ctx.fillStyle=th.accent+'44'; ctx.fillRect(b.x-b.w*0.4,H-by+20,b.w*0.8,14); ctx.strokeStyle=th.accent+'88'; ctx.lineWidth=1; ctx.strokeRect(b.x-b.w*0.4,H-by+20,b.w*0.8,14); }
  });
  ctx.globalAlpha=1;
  ctx.strokeStyle='rgba(20,12,0,0.85)'; ctx.lineWidth=1.2;
  bgWires.forEach(function(w){
    var wy=(w.y+bgY*0.5)%H;
    ctx.beginPath(); ctx.moveTo(0,wy);

    ctx.stroke();
    ctx.fillStyle='rgba(15,8,0,0.9)'; ctx.fillRect(w.xOff-3,wy-60,5,80); ctx.fillRect(w.xOff-14,wy-55,28,4);
    ctx.fillStyle='rgba(80,60,20,0.7)'; ctx.beginPath(); ctx.arc(w.xOff-10,wy-53,3,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(w.xOff+10,wy-53,3,0,Math.PI*2); ctx.fill();
  });
  bgSigns.forEach(function(s){
    var sy=(s.y+bgY*0.25)%H;
    if(sy>-20&&sy<H+20){ ctx.font='bold 9px monospace'; ctx.fillStyle=th.accent+'99'; ctx.shadowColor=th.accent; ctx.shadowBlur=6; ctx.fillText(s.text,s.x,sy); ctx.shadowBlur=0; }
  });
  var mf=0.7+0.3*Math.sin(frame*0.07);
  ctx.fillStyle='rgba(255,220,120,'+mf*0.9+')'; ctx.shadowColor='#FFD700'; ctx.shadowBlur=20*mf;
  ctx.beginPath(); ctx.arc(W*0.78,45,18,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle=THEMES[lvl].sky0; ctx.beginPath(); ctx.arc(W*0.78+8,40,14,0,Math.PI*2); ctx.fill();
}

function drawLasers(){
  lasers.forEach(function(l){
    var prog=l.life/28;
    ctx.save();
    ctx.globalAlpha=prog;
    // レーザービーム本体
    ctx.strokeStyle='#FF0';
    ctx.lineWidth=3;
    ctx.shadowColor='#FF0';
    ctx.shadowBlur=12;
    ctx.beginPath();
    ctx.moveTo(l.x, l.y);
    ctx.lineTo(l.x - l.vx*2.5, l.y - l.vy*2.5);
    ctx.stroke();
    // コア（白）
    ctx.strokeStyle='#FFF';
    ctx.lineWidth=1.2;
    ctx.shadowBlur=5;
    ctx.beginPath();
    ctx.moveTo(l.x, l.y);
    ctx.lineTo(l.x - l.vx*1.8, l.y - l.vy*1.8);
    ctx.stroke();
    ctx.shadowBlur=0;
    ctx.restore();
  });
}

function drawCRT(th){
  ctx.fillStyle=th.scanline;
  for(var sy=0;sy<H;sy+=3){ ctx.fillRect(0,sy,W,1); }
  ctx.globalAlpha=0.07; ctx.drawImage(noiseCanvas,0,0); ctx.globalAlpha=1;
  var vg=ctx.createRadialGradient(W/2,H/2,H*0.28,W/2,H/2,H*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=th.crt; ctx.fillRect(0,0,W,H);
  if(Math.random()<0.015){ var gy=Math.random()*H|0,gh=1+Math.random()*3|0,gx=(Math.random()-0.5)*8; var id=ctx.getImageData(0,gy,W,gh); ctx.putImageData(id,gx,gy); }
}

// ============================================================
// WALLS
// ============================================================
function drawWalls(th){
  walls.forEach(function(w){
    w.segs.forEach(function(s){
      ctx.fillStyle=th.wall; ctx.fillRect(s.x,w.y,s.w,WALL_THICK);
      ctx.fillStyle=th.wallH; ctx.fillRect(s.x,w.y,s.w,2);
      ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(s.x,w.y+WALL_THICK-3,s.w,3);
      ctx.fillStyle='rgba(0,0,0,0.2)';
      for(var bx=s.x;bx<s.x+s.w;bx+=16){ ctx.fillRect(bx,w.y,1,WALL_THICK); }
      ctx.fillRect(s.x,w.y+WALL_THICK/2,s.w,1);
      ctx.shadowColor=th.accent; ctx.shadowBlur=4; ctx.fillStyle=th.accent+'88';
      ctx.fillRect(s.x,w.y,2,WALL_THICK); ctx.fillRect(s.x+s.w-2,w.y,2,WALL_THICK); ctx.shadowBlur=0;
    });
  });
}

// ============================================================
// ITEMS
// ============================================================
function drawItems(){
  items.forEach(function(it){
    var pulse=1+0.14*Math.sin(it.tw);
    ctx.save(); ctx.translate(it.x,it.y); ctx.scale(pulse,pulse);
    var em=it.type==='life'?'❤':it.type==='inv'?'★':it.type==='phase'?'◈':'⚡';
    var col=it.type==='life'?'#FF4444':it.type==='inv'?'#FFD700':it.type==='phase'?'#44ccff':'#FFFF00';
    // レーザーアイテムは回転エフェクト
    if(it.type==='laser'){
      ctx.rotate(it.tw);
      ctx.shadowColor='#FFFF00'; ctx.shadowBlur=22;
      // 八方向の光線ミニ表示
      for(var di=0;di<8;di++){
        var da=di*Math.PI/4;
        ctx.strokeStyle='rgba(255,255,0,0.5)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(Math.cos(da)*8,Math.sin(da)*8); ctx.lineTo(Math.cos(da)*14,Math.sin(da)*14); ctx.stroke();
      }
    } else {
      ctx.shadowColor=col; ctx.shadowBlur=16;
    }
    ctx.fillStyle=col; ctx.font='bold 18px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(em,0,0);
    ctx.restore();
    ctx.fillStyle=col+'cc'; ctx.font='bold 7px monospace'; ctx.textAlign='center'; ctx.shadowColor=col; ctx.shadowBlur=4;
    ctx.fillText(it.type==='life'?'LIFE':it.type==='inv'?'STAR':it.type==='phase'?'PASS':'BEAM',it.x,it.y-18);
    ctx.shadowBlur=0; ctx.textAlign='left';
  });
}

// ============================================================
// HUD
// ============================================================
function drawHUD(th){
  ctx.font='bold 13px monospace'; ctx.textAlign='left';
  var hs=''; for(var i=0;i<Math.max(0,lives);i++) hs+='♥';
  ctx.fillStyle='#FF4444'; ctx.shadowColor='#FF4444'; ctx.shadowBlur=6; ctx.fillText(hs,6,22); ctx.shadowBlur=0;
  ctx.fillStyle=th.accent; ctx.shadowColor=th.accent; ctx.shadowBlur=8; ctx.font='bold 12px monospace'; ctx.textAlign='right';
  ctx.fillText(Math.floor(score)+'m',W-6,20); ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,200,0.45)'; ctx.font='7px monospace'; ctx.fillText('BEST '+Math.floor(best)+'m',W-6,31);
  var lvc=[th.accent,'#CD853F','#FFD700','#FF4444','#FF00FF'][lvl];
  ctx.fillStyle=lvc; ctx.shadowColor=lvc; ctx.shadowBlur=4; ctx.font='bold 8px monospace'; ctx.fillText('LV'+lvl+' '+THEMES[lvl].name,W-6,42); ctx.shadowBlur=0; ctx.textAlign='left';
  var px=6,py=H-8; ctx.font='8px monospace';
  if(invF>0){ctx.fillStyle='#FFD700';ctx.shadowColor='#FFD700';ctx.shadowBlur=4;ctx.fillText('★INV:'+Math.ceil(invF/60)+'s',px,py);px+=64;ctx.shadowBlur=0;}
  if(phaseF>0){ctx.fillStyle='#44ccff';ctx.shadowColor='#44ccff';ctx.shadowBlur=4;ctx.fillText('◈PASS:'+Math.ceil(phaseF/60)+'s',px,py);px+=70;ctx.shadowBlur=0;}
  if(laserF>0){ctx.fillStyle='#FFFF00';ctx.shadowColor='#FFFF00';ctx.shadowBlur=6;ctx.fillText('⚡BEAM:'+Math.ceil(laserF/60)+'s',px,py);ctx.shadowBlur=0;}
  if(lvlFlash>0){
    var al=Math.min(1,lvlFlash/30); ctx.globalAlpha=al;
    ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(0,H/2-48,W,96);
    ctx.fillStyle=lvc; ctx.shadowColor=lvc; ctx.shadowBlur=25; ctx.font='bold 22px monospace'; ctx.textAlign='center';
    ctx.fillText('>> LEVEL UP! <<',W/2,H/2-8); ctx.font='bold 11px monospace'; ctx.fillText('LV'+lvl+' '+THEMES[lvl].name,W/2,H/2+16);
    ctx.shadowBlur=0; ctx.globalAlpha=1; ctx.textAlign='left';
  }
}

// ============================================================
// TITLE / GAME OVER
// ============================================================
var titleFrame=0;
function drawTitle(){
  titleFrame++;
  var gr=ctx.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#080400'); gr.addColorStop(0.6,'#120900'); gr.addColorStop(1,'#1a0d00');
  ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
  drawRetroCity(THEMES[0]);
  ctx.textAlign='center';
  ctx.fillStyle='#000'; ctx.font='bold 42px monospace'; ctx.fillText('のぼれ！',W/2+2,H*0.20+2); ctx.fillText('ボーイ',W/2+2,H*0.31+2);
  var fl=0.8+0.2*Math.sin(titleFrame*0.08);
  ctx.fillStyle='rgba(244,164,96,'+fl+')'; ctx.shadowColor='#F4A460'; ctx.shadowBlur=20*fl; ctx.font='bold 42px monospace'; ctx.fillText('のぼれ！',W/2,H*0.20);
  ctx.fillStyle='rgba(255,80,0,'+fl+')'; ctx.shadowColor='#FF5000'; ctx.shadowBlur=28*fl; ctx.font='bold 46px monospace'; ctx.fillText('ボーイ',W/2,H*0.31); ctx.shadowBlur=0;
  ctx.fillStyle='rgba(200,160,80,0.7)'; ctx.font='8px monospace'; ctx.fillText('- KOENJI RETRO ACTION -',W/2,H*0.37);
  var bounce=Math.sin(titleFrame*0.07)*5;
  drawBoy(W/2,H*0.52+bounce,1.6,titleFrame,false,false);
  var infos=[
    {t:'HOLD: 上昇  RELEASE: 落下',c:'rgba(244,164,96,0.9)'},
    {t:'敵を上から踏んで倒せ！',c:'rgba(200,130,60,0.85)'},
    {t:'⚡BEAMで八方向レーザー！',c:'rgba(255,255,0,0.9)'},
    {t:'❤ HP  ★ 無敵  ◈ すり抜け',c:'rgba(180,220,255,0.8)'},
  ];
  var iy=H*0.68; ctx.font='9px monospace';
  infos.forEach(function(inf){ ctx.fillStyle=inf.c; ctx.shadowColor=inf.c; ctx.shadowBlur=4; ctx.fillText(inf.t,W/2,iy); iy+=17; });
  ctx.shadowBlur=0;
  if(best>0){ctx.fillStyle='rgba(150,120,60,0.7)';ctx.font='8px monospace';ctx.fillText('BEST: '+Math.floor(best)+'m',W/2,iy+2);iy+=16;}
  if(Math.floor(titleFrame/22)%2===0){ ctx.fillStyle=THEMES[0].accent; ctx.shadowColor=THEMES[0].accent; ctx.shadowBlur=10; ctx.font='bold 13px monospace'; ctx.fillText('[ PUSH START ]',W/2,iy+10); ctx.shadowBlur=0; }
  ctx.textAlign='left';
  drawCRT(THEMES[0]);
}
function drawGameOver(){
  ctx.fillStyle='rgba(0,0,0,0.82)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#FF4444'; ctx.shadowColor='#FF4444'; ctx.shadowBlur=24; ctx.font='bold 28px monospace'; ctx.fillText('GAME OVER',W/2,H/2-60); ctx.shadowBlur=0;
  ctx.fillStyle=THEMES[0].accent; ctx.shadowColor=THEMES[0].accent; ctx.shadowBlur=12; ctx.font='bold 16px monospace'; ctx.fillText(Math.floor(score)+'m 登った！',W/2,H/2-18); ctx.shadowBlur=0;
  ctx.fillStyle='rgba(200,160,80,0.6)'; ctx.font='9px monospace'; ctx.fillText('BEST: '+Math.floor(best)+'m',W/2,H/2+6);
  var lvc=[THEMES[0].accent,'#CD853F','#FFD700','#FF4444','#FF00FF'][lvl];
  ctx.fillStyle=lvc; ctx.font='8px monospace'; ctx.fillText('MAX LV'+lvl+' '+THEMES[lvl].name,W/2,H/2+26);
  if(Math.floor(frame/22)%2===0){ ctx.fillStyle=THEMES[0].accent; ctx.shadowColor=THEMES[0].accent; ctx.shadowBlur=8; ctx.font='bold 12px monospace'; ctx.fillText('[ PUSH START ]',W/2,H/2+66); ctx.shadowBlur=0; }
  ctx.textAlign='left';
}

// ============================================================
// MAIN DRAW
// ============================================================
function draw(){
  ctx.clearRect(0,0,W,H);
  var th=THEMES[lvl]||THEMES[0];
  if(STATE==='title'){ drawTitle(); return; }
  ctx.save(); ctx.translate(shakeX,shakeY);
  var gr=ctx.createLinearGradient(0,0,0,H); gr.addColorStop(0,th.sky0); gr.addColorStop(1,th.sky1);
  ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
  drawRetroCity(th);
  drawWalls(th);
  drawItems();
  enemies.forEach(drawEnemy);
  drawLasers();
  var showPl=!(invF>0&&Math.floor(frame/5)%2===0);
  if(showPl){
    if(invF>0){ctx.shadowColor='#FFD700';ctx.shadowBlur=20;}
    if(phaseF>0){ctx.shadowColor='#44ccff';ctx.shadowBlur=15;}
    if(laserF>0){ctx.shadowColor='#FFFF00';ctx.shadowBlur=18;}
    drawBoy(PL.x,PL.y,1,PL.animT,invF>0,phaseF>0);
    ctx.shadowBlur=0;
  }
  particles.forEach(function(p){ ctx.globalAlpha=p.life/p.max; ctx.fillStyle=p.col; ctx.shadowColor=p.col; ctx.shadowBlur=5; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); }); ctx.globalAlpha=1; ctx.shadowBlur=0;
  ctx.restore();
  drawHUD(th);
  if(STATE==='over') drawGameOver();
  drawCRT(th);
}

// ============================================================
// INPUT
// ============================================================
var tapping=false;
function onDown(){ try{var a=getAC();if(a&&a.state==='suspended')a.resume();}catch(e){} if(STATE==='title'){initGame();return;} if(STATE==='over'){initGame();return;} if(!tapping){tapping=true;PL.held=true;playJump();} }
function onUp(){ tapping=false; PL.held=false; }
cv.addEventListener('pointerdown',function(e){e.preventDefault();onDown();},{passive:false});
cv.addEventListener('pointerup',function(e){e.preventDefault();onUp();},{passive:false});
cv.addEventListener('pointercancel',function(){onUp();});
document.addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();onDown();}});
document.addEventListener('keyup',function(e){if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();onUp();}});

function gameLoop(){update();draw();requestAnimationFrame(gameLoop);}
requestAnimationFrame(gameLoop);
})();
</script>
</body>
