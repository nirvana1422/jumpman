<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SPACE RAIDERS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Press Start 2P',monospace;touch-action:none;}
  #gw{position:relative;width:100%;height:100vh;overflow:hidden;}
  canvas{position:absolute;top:0;left:0;width:100%;height:100%;}
  #bc{z-index:0;}#gc{z-index:1;cursor:none;}
  #ui{position:absolute;top:0;left:0;right:0;z-index:2;padding:8px 12px;display:flex;justify-content:space-between;pointer-events:none;}
  .ub{display:flex;flex-direction:column;gap:2px;}
  .ul{font-size:6px;color:rgba(255,255,255,0.45);}
  .uv{font-size:11px;color:#fff;}
  #sV{color:#00ffcc;}#lV{color:#ff9f00;}#liV{color:#ff4466;}
  #ov{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,0,0,0.88);gap:16px;padding:28px;text-align:center;}
  #ov h1{font-size:24px;color:#00ffcc;text-shadow:0 0 18px #00ffcc;animation:pulse 1.5s ease-in-out infinite;line-height:1.5;}
  #ov p{font-size:7px;color:#aaa;line-height:2.3;}
  .btn{padding:11px 22px;background:transparent;border:2px solid currentColor;font-family:'Press Start 2P',monospace;font-size:11px;cursor:pointer;animation:blink 1s step-end infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  #iN{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);z-index:5;font-size:9px;color:#ffdd00;text-shadow:0 0 10px #ffdd00;pointer-events:none;opacity:0;transition:opacity 0.3s;white-space:nowrap;}
  #lB{position:absolute;top:28%;left:50%;transform:translateX(-50%);z-index:6;font-size:15px;color:#ff9f00;text-shadow:0 0 16px #ff9f00;pointer-events:none;opacity:0;transition:opacity 0.4s;white-space:nowrap;}
  /* デバッグ用小表示（消してOK） */
  #dbg{position:absolute;left:8px;bottom:8px;z-index:20;color:#fff;font-size:10px;opacity:0.7;pointer-events:none}
</style>
</head>
<body>
<div id="gw">
  <canvas id="bc"></canvas>
  <canvas id="gc"></canvas>
  <div id="ui">
    <div class="ub"><span class="ul">SCORE</span><span class="uv" id="sV">0</span></div>
    <div class="ub" style="align-items:center"><span class="ul">LEVEL</span><span class="uv" id="lV">1</span></div>
    <div class="ub" style="align-items:flex-end"><span class="ul">LIVES</span><span class="uv" id="liV">♥♥♥</span></div>
  </div>
  <div id="ov">
    <h1>SPACE<br>RAIDERS</h1>
    <p>スライドでキャラ移動（タッチ/ドラッグ）<br>弾は自動発射！<br><br>♥ ライフ回復<br>⚡ 攻撃速度2倍<br>★ 無敵モード</p>
    <button class="btn" style="color:#00ffcc" id="sBtn">▶ START</button>
  </div>
  <div id="iN"></div>
  <div id="lB"></div>
  <div id="dbg"></div>
</div>
<script>
const bcv=document.getElementById('bc'),bx=bcv.getContext('2d');
const cv=document.getElementById('gc'),cx=cv.getContext('2d');
const gw=document.getElementById('gw');
const dbg=document.getElementById('dbg');
let W,H;
function resize(){W=gw.clientWidth;H=gw.clientHeight;cv.width=W;cv.height=H;bcv.width=W;bcv.height=H;}
resize();window.addEventListener('resize',resize);

// 角丸矩形互換
function ctxRoundRect(ctx, x, y, w, h, r) {
  if (typeof ctx.roundRect === 'function') { ctx.roundRect(x,y,w,h,r); return; }
  if (r === undefined) r = 4;
  const rx = Math.min(r, w/2), ry = Math.min(r, h/2);
  ctx.beginPath();
  ctx.moveTo(x + rx, y);
  ctx.lineTo(x + w - rx, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + ry);
  ctx.lineTo(x + w, y + h - ry);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rx, y + h);
  ctx.lineTo(x + rx, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - ry);
  ctx.lineTo(x, y + ry);
  ctx.quadraticCurveTo(x, y, x + rx, y);
  ctx.closePath();
}

// Audio (軽めに)
let AC;
function getAC(){ if(!AC) AC=new(window.AudioContext||window.webkitAudioContext)(); return AC; }
function beep(f,d,t='square',v=0.1,dl=0){ try{const ac=getAC(),o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime+dl);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dl+d);o.start(ac.currentTime+dl);o.stop(ac.currentTime+dl+d+0.02);}catch(e){}}
const snd={ shoot:()=>beep(880,0.07,'square',0.09), eshoot:()=>beep(200,0.09,'sawtooth',0.06), explode:()=>beep(280,0.28,'sawtooth',0.12), item:()=>{}, lvlup:()=>{}, hit:()=>beep(90,0.35,'sawtooth',0.2)};

let gs='title',score=0,lives=3,level=1,kills=0;
const KPL=20;
let pl,buls,ebuls,enems,bars,items,parts;
let eDir,sTm,esTm,iTm,eMoveTimer;
let inv=false,invT=0,spd=false,spdT=0;
let targetX = null;
let lastT = 0;

document.getElementById('sBtn').addEventListener('click', startGame, false);

function startGame(){
  dbg.textContent = 'startGame() called';
  try{ getAC().resume(); }catch(e){}
  const ov = document.getElementById('ov');
  if(ov) ov.style.display='none';
  score=0; lives=3; level=1; kills=0; bgT=0;
  updUI();
  initGame();
  gs='playing';
  showN('START');
  // 初回の時間基準を必ずセット（安定した dt を得るため）
  lastT = performance.now();
  // kick the loop
  requestAnimationFrame(loop);
}

function initGame(){
  const pw=Math.min(W,480)*0.07;
  pl={x:W/2,y:H-68,w:pw,h:pw*0.55,sp:W*0.0015,color:'#00ffcc'};
  buls=[]; ebuls=[]; parts=[]; items=[];
  sTm=0; esTm=0; iTm=260; inv=false; invT=0; spd=false; spdT=0;
  eMoveTimer=0; targetX=null;
  spawnEnemies(); initBars();
  dbg.textContent = 'initGame OK';
}

function spawnEnemies(){
  enems=[]; eDir=1;
  const cols=9, rows=4, ex=W*0.06, ey=H*0.12;
  const gx=(W-ex*2)/cols, gy=H*0.055;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++)
    enems.push({x:ex+c*gx+gx/2,y:ey+r*gy,w:W*0.053,h:W*0.038,sp,row:r,alive:true,fr:0,frt:0,color:r===0?'#ff4466':r<=2?'#ff9f00':'#00ddff',pts:r===0?30:r<=2?20:10});
}

function initBars(){
  bars=[];
  const n=4,bw=W*0.1,bh=H*0.028,gap=(W-n*bw)/(n+1);
  for(let i=0;i<n;i++) bars.push({x:gap+i*(bw+gap),y:H-130,w:bw,h:bh,hp:5,mhp:5});
}

const STARS=Array.from({length:100},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.3+0.3,sp:Math.random()*0.2+0.08,a:Math.random()}));
const BGT=[{top:'#000010',bot:'#000828',star:'#aaccff'},{top:'#0d0010',bot:'#250020',star:'#ffaaff'},{top:'#001008',bot:'#002818',star:'#aaffcc'}];
let bgT=0;
function drawBg(){
  const t=BGT[bgT], g=bx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,t.top); g.addColorStop(1,t.bot); bx.fillStyle=g; bx.fillRect(0,0,W,H);
  STARS.forEach(s=>{ s.y += s.sp*0.001; if(s.y>1) s.y=0; bx.beginPath(); bx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2); bx.fillStyle=t.star; bx.globalAlpha=s.a*0.7+0.2; bx.fill(); bx.globalAlpha=1; });
}

function update(dt){
  // 入力追従（スライド）
  if(targetX !== null && pl){
    const followFactor = Math.min(1, 0.35 * (dt / 16));
    pl.x += (targetX - pl.x) * followFactor;
  }
  if(pl) pl.x = Math.max(pl.w/2, Math.min(W-pl.w/2, pl.x));

  if(inv){ invT -= dt; if(invT<=0){ inv=false; showN(''); } }
  if(spd){ spdT -= dt; if(spdT<=0){ spd=false; showN(''); } }

  if(++sTm >= (spd?16:35)){ sTm=0; buls.push({x:pl.x,y:pl.y-pl.h,w:3,h:14,sp:12,color:'#00ffcc'}); snd.shoot(); }
  buls = buls.filter(b=>{ b.y -= b.sp; return b.y > -20; });
  ebuls = ebuls.filter(b=>{ b.y += b.sp; return b.y < H+20; });
  items = items.filter(it=>{ it.y += 1.6; it.rot = (it.rot||0) + 0.05; return it.y < H+30; });

  const alive = enems.filter(e=>e.alive);
  if(!alive.length){ nextLv(); return; }

  let minX=Infinity, maxX=-Infinity, maxY=-Infinity;
  alive.forEach(e=>{ minX=Math.min(minX,e.x-e.w/2); maxX=Math.max(maxX,e.x+e.w/2); maxY=Math.max(maxY,e.y+e.h/2); });

  // インベーダー風移動
  eMoveTimer += dt;
  const moveInterval = Math.max(120, 700 - (level-1) * 40);
  if(eMoveTimer >= moveInterval){
    eMoveTimer = 0;
    const stepX = Math.max(6, W * 0.03);
    const stepY = Math.max(8, H * 0.03);
    const nextMinX = minX + eDir * stepX;
    const nextMaxX = maxX + eDir * stepX;
    if(nextMaxX >= W - 12 || nextMinX <= 12){
      alive.forEach(e=> e.y += stepY);
      eDir *= -1;
      if(maxY + stepY >= (pl? pl.y - pl.h : H)) { loseLv(); return; }
    } else {
      alive.forEach(e=>{ e.x += eDir * stepX; e.frt++; if(e.frt > 12){ e.fr = 1 - e.fr; e.frt = 0; } });
    }
  }

  if(maxY >= (pl? pl.y - pl.h : H)){ loseLv(); return; }

  const sr = Math.max(36, 95 - level*8);
  if(++esTm >= sr){ esTm = 0; const sh = alive[Math.floor(Math.random()*alive.length)]; if(sh){ ebuls.push({x:sh.x,y:sh.y+sh.h/2,w:4,h:11,sp:3.5+level*0.5,color:'#ff4466'}); snd.eshoot(); } }

  if(--iTm <= 0){ iTm = 280 + Math.random()*380; const tp=['life','speed','inv'][Math.floor(Math.random()*3)]; items.push({x:30+Math.random()*(W-60),y:-20,type:tp,rot:0}); }

  // 当たり判定（自機弾 → 敵）
  buls.forEach(b=>{
    enems.forEach(e=>{
      if(!e.alive || b.dead) return;
      if(Math.abs(b.x - e.x) < e.w/2 && Math.abs(b.y - e.y) < e.h/2){
        b.dead = true; e.alive = false; score += e.pts; kills++; snd.explode(); spawnFx(e.x,e.y,e.color); checkLv(); updUI();
      }
    });
  });

  // 自機弾がバリアに当たると消える
  buls.forEach(b=>{
    if(b.dead) return;
    bars.forEach(br=>{
      if(br.hp <= 0) return;
      if(b.x > br.x && b.x < br.x + br.w && b.y > br.y && b.y < br.y + br.h){
        b.dead = true;
      }
    });
  });

  buls = buls.filter(b => !b.dead);

  ebuls.forEach(b=>{ bars.forEach(br=>{ if(br.hp<=0) return; if(b.x>br.x && b.x<br.x+br.w && b.y>br.y && b.y<br.y+br.h){ b.dead=true; br.hp--; } }); });
  ebuls = ebuls.filter(b=>!b.dead);

  if(!inv){ ebuls.forEach(b=>{ if(pl && Math.abs(b.x-pl.x) < pl.w/2 && Math.abs(b.y-pl.y) < pl.h){ b.dead=true; loseLv(); } }); ebuls = ebuls.filter(b=>!b.dead); }

  items.forEach(it=>{ if(pl && Math.abs(it.x - pl.x) < 24 && Math.abs(it.y - pl.y) < 26){ it.dead=true; applyItem(it.type); snd.item(); } });
  items = items.filter(i=>!i.dead);
  parts = parts.filter(p=>{ p.x += p.vx; p.y += p.vy; p.vx *= 0.93; p.vy *= 0.93; p.life--; return p.life>0; });
}

function nextLv(){ level++; bgT = Math.min(level-1, BGT.length-1); updUI(); showLB(); snd.lvlup(); startMusic(level); spawnEnemies(); }
function checkLv(){ const nl = Math.floor(kills/KPL)+1; if(nl>level){ level = nl; bgT = Math.min(level-1, BGT.length-1); showLB(); snd.lvlup(); startMusic(level); enems.filter(e=>e.alive).forEach(e=>e.sp=0.55+(level-1)*0.22); updUI(); } }
function loseLv(){ lives--; snd.hit(); spawnFx(pl?pl.x:W/2, pl?pl.y:H-60,'#ff4466',22); updUI(); if(lives<=0) gameOver(); else { inv=true; invT=100; } }
function applyItem(tp){
  if(tp==='life'){ lives = Math.min(lives+1,5); showN('♥ ライフ +1!'); updUI(); }
  else if(tp==='speed'){ spd=true; spdT=8000; showN('⚡ 攻撃速度2倍! (持続約8秒)'); }
  else { inv=true; invT=8000; showN('★ 無敵モード！ (持続約8秒)'); }
}
function spawnFx(x,y,col,n=12){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=Math.random()*4+1; parts.push({x,y,col,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:20+Math.random()*20,ml:40,r:Math.random()*3+1}); } }
function gameOver(){ gs='gameover'; stopMusic(); const ol=document.getElementById('ov'); if(ol){ ol.style.display='flex'; ol.innerHTML=`<h1 style="color:#ff4466;text-shadow:0 0 20px #ff4466">GAME<br>OVER</h1><p style="color:#fff;font-size:10px">SCORE <span style="color:#00ffcc">${score}</span></p><p style="color:#888;font-size:7px">LEVEL ${level}</p><button class="btn" style="color:#ff4466" onclick="startGame()">▶ RETRY</button>`; } }
function updUI(){ document.getElementById('sV').textContent = score; document.getElementById('lV').textContent = level; document.getElementById('liV').textContent = '♥'.repeat(lives) + '♡'.repeat(Math.max(0,3-lives)); }
let nTo; function showN(m){ const el=document.getElementById('iN'); if(!el) return; el.textContent = m; el.style.opacity = m? '1' : '0'; clearTimeout(nTo); if(m) nTo = setTimeout(()=>el.style.opacity='0',2200); }
let lTo; function showLB(){ const el=document.getElementById('lB'); if(!el) return; el.textContent = `LEVEL ${level}!`; el.style.opacity='1'; clearTimeout(lTo); lTo=setTimeout(()=>el.style.opacity='0',2000); }

function draw(){
  cx.clearRect(0,0,W,H); drawBg();
  // barriers
  bars.forEach(br=>{
    if(br.hp<=0) return;
    const a=br.hp/br.mhp, cs=['#ff3333','#ff6600','#ffcc00','#88ff00','#00ffcc'], c=cs[Math.min(br.hp-1,4)];
    cx.globalAlpha = 0.25 + a*0.55;
    cx.fillStyle = c;
    ctxRoundRect(cx, br.x, br.y, br.w, br.h, 4);
    cx.fill();
    cx.globalAlpha = 1;
    cx.strokeStyle = c; cx.lineWidth = 1.5; cx.stroke();
    for(let i=0;i<br.mhp;i++){ cx.fillStyle = i < br.hp ? '#00ffcc' : 'rgba(255,255,255,0.1)'; cx.fillRect(br.x+2+i*(br.w-4)/br.mhp, br.y+br.h-4, (br.w-4)/br.mhp-1, 3); }
  });

  // player
  if(pl){
    const p=pl, fl = inv && Math.floor(Date.now()/90)%2===0;
    if(!fl){
      cx.globalAlpha = inv?0.65:1; cx.fillStyle = inv? '#88ffee' : p.color; cx.shadowColor = p.color; cx.shadowBlur = spd?22:10;
      cx.beginPath(); cx.moveTo(p.x,p.y-p.h*1.3); cx.lineTo(p.x-p.w/2,p.y+p.h/2); cx.lineTo(p.x-p.w*0.18,p.y+p.h*0.2); cx.lineTo(p.x+p.w*0.18,p.y+p.h*0.2); cx.lineTo(p.x+p.w/2,p.y+p.h/2); cx.closePath(); cx.fill();
      cx.shadowBlur = 0; cx.globalAlpha = 1;
      cx.fillStyle = spd? '#ffee00' : '#ff6600'; cx.shadowColor = cx.fillStyle; cx.shadowBlur = 12;
      cx.beginPath(); cx.ellipse(p.x, p.y+p.h*0.55, p.w*0.1, p.h*0.22+Math.random()*5, 0,0,Math.PI*2); cx.fill(); cx.shadowBlur=0;
    }
  }

  // bullets
  buls.forEach(b=>{ cx.fillStyle=b.color; cx.shadowColor=b.color; cx.shadowBlur=7; cx.fillRect(b.x-1.5,b.y,3,b.h); cx.shadowBlur=0; });
  ebuls.forEach(b=>{ cx.fillStyle=b.color; cx.shadowColor=b.color; cx.shadowBlur=8; cx.save(); cx.translate(b.x,b.y+b.h/2); cx.rotate(Math.PI/4); cx.fillRect(-4,-4,8,8); cx.restore(); cx.shadowBlur=0; });

  // enemies
  enems.forEach(e=>{
    if(!e.alive) return;
    cx.fillStyle = e.color; cx.shadowColor = e.color; cx.shadowBlur = 6;
    const ex=e.x, ey=e.y, ew=e.w, eh=e.h;
    if(e.row===0){
      cx.beginPath(); cx.ellipse(ex,ey,ew/2,eh/2.2,0,0,Math.PI*2); cx.fill();
      cx.fillStyle='rgba(0,0,0,0.65)'; cx.beginPath(); cx.arc(ex-ew*0.14,ey-eh*0.07,ew*0.1,0,Math.PI*2); cx.arc(ex+ew*0.14,ey-eh*0.07,ew*0.1,0,Math.PI*2); cx.fill();
    }else if(e.row<=2){
      ctxRoundRect(cx, ex-ew/2, ey-eh/2, ew, eh, 3); cx.fill();
      cx.strokeStyle=e.color; cx.lineWidth=2; cx.beginPath();
      cx.moveTo(ex-ew*0.2,ey-eh/2); cx.lineTo(ex-ew*0.35+(e.fr?3:0),ey-eh);
      cx.moveTo(ex+ew*0.2,ey-eh/2); cx.lineTo(ex+ew*0.35-(e.fr?3:0),ey-eh);
      for(let i=0;i<2;i++){ cx.moveTo(ex-ew/2-2,ey-eh/4+i*eh/2); cx.lineTo(ex-ew/2-(e.fr?7:4),ey-eh/4+i*eh/2+3); cx.moveTo(ex+ew/2+2,ey-eh/4+i*eh/2); cx.lineTo(ex+ew/2+(e.fr?7:4),ey-eh/4+i*eh/2+3); }
      cx.stroke();
    }else{
      cx.beginPath(); cx.arc(ex,ey,ew/2.2,0,Math.PI*2); cx.fill();
      cx.strokeStyle=e.color; cx.lineWidth=2;
      for(let i=0;i<4;i++){ const a=(i/4)*Math.PI*2, r=ew/2.2; cx.beginPath(); cx.moveTo(ex+Math.cos(a)*r,ey+Math.sin(a)*r); cx.lineTo(ex+Math.cos(a)*(r+7+(e.fr?4:0)),ey+Math.sin(a)*(r+7+(e.fr?4:0))); cx.stroke(); }
      cx.fillStyle='#000'; cx.beginPath(); cx.arc(ex-3,ey-2,2.5,0,Math.PI*2); cx.arc(ex+3,ey-2,2.5,0,Math.PI*2); cx.fill();
    }
    cx.shadowBlur=0;
  });

  // items
  const iC={life:'#ff4466',speed:'#ffdd00',inv:'#00ffcc'}, iL={life:'♥',speed:'⚡',inv:'★'};
  items.forEach(it=>{ cx.save(); cx.translate(it.x,it.y); cx.rotate(it.rot); cx.fillStyle=iC[it.type]; cx.shadowColor=iC[it.type]; cx.shadowBlur=14; cx.beginPath(); cx.arc(0,0,13,0,Math.PI*2); cx.fill(); cx.shadowBlur=0; cx.fillStyle='#000'; cx.font='13px serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(iL[it.type],0,1); cx.restore(); });

  // particles
  parts.forEach(p=>{ cx.globalAlpha = p.life/p.ml; cx.fillStyle = p.col; cx.shadowColor = p.col; cx.shadowBlur = 4; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,Math.PI*2); cx.fill(); });
  cx.globalAlpha = 1; cx.shadowBlur = 0;

  // scanlines
  cx.fillStyle='rgba(0,0,0,0.04)'; for(let y=0;y<H;y+=4) cx.fillRect(0,y,W,2);
}

// メインループ（堅牢化）
function loop(ts=0){
  if(gs!=='playing') return;
  let dt = ts - lastT;
  if(!lastT || !isFinite(dt) || dt<=0) dt = 16;
  dt = Math.min(Math.max(dt,1),64);
  lastT = ts;
  try{
    update(dt);
    draw();
    // デバッグ表示（任意）
    dbg.textContent = `dt:${Math.round(dt)}ms score:${score} level:${level}`;
    requestAnimationFrame(loop);
  }catch(err){
    console.error('game loop error',err);
    showN('エラー発生: ' + (err && err.message ? err.message : 'unknown'));
    gs='title';
    stopMusic();
    const ol=document.getElementById('ov'); if(ol) ol.style.display='flex';
  }
}

// 入力（スライド）
// pl が初期化されていない場合は無視するようにガード
function setTargetFromClientX(clientX){
  if(!pl) return;
  const rect = gw.getBoundingClientRect();
  const x = clientX - rect.left;
  targetX = Math.max(pl.w/2, Math.min(W - pl.w/2, x));
}

cv.addEventListener('touchstart', e=>{ e.preventDefault(); try{ getAC().resume(); }catch(e){} if(e.touches && e.touches[0]) setTargetFromClientX(e.touches[0].clientX); }, {passive:false});
cv.addEventListener('touchmove', e=>{ e.preventDefault(); if(e.touches && e.touches[0]) setTargetFromClientX(e.touches[0].clientX); }, {passive:false});
cv.addEventListener('touchend', e=>{ e.preventDefault(); targetX = null; }, {passive:false});

cv.addEventListener('mousedown', e=>{ try{ getAC().resume(); }catch(e){} setTargetFromClientX(e.clientX); });
cv.addEventListener('mousemove', e=>{ if(e.buttons) setTargetFromClientX(e.clientX); });
cv.addEventListener('mouseup', ()=>{ targetX = null; });

// タイトル時の背景ループ（残しておく）
(function bgL(){ if(gs==='title'){ drawBg(); requestAnimationFrame(bgL); } })();

// 簡易ミュージックコントロール（空実装）
function startMusic(lv){/* noop for debug */} function stopMusic(){/* noop */}

// 最初に背景を描く
drawBg();
</script>
